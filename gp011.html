<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยผู้บริหาร | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 60px}h1{font-size:25px}.search,input,textarea,select{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:100px}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.field{position:relative}.field label{display:block;font-weight:700;margin:9px 0 5px}.mic{position:absolute;right:7px;top:38px;border:0;background:#eef3f8;border-radius:8px;padding:7px;cursor:pointer}.mic.listening{background:#c62828;color:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>👨‍💼 ผู้ช่วยผู้บริหาร</h1><input class="search" id="filter" placeholder="ค้นหา เช่น สรุปผู้บริหาร One Page คำกล่าว Dashboard"><section class="list" id="tasks"><button class="task" data-task="สรุปผู้บริหาร (Executive Summary)">📄 สรุปผู้บริหาร</button><button class="task" data-task="One Page เพื่อเสนอผู้บริหาร">📑 One Page</button><button class="task" data-task="วิเคราะห์เรื่องก่อนเสนออนุมัติ">✅ วิเคราะห์ก่อนอนุมัติ</button><button class="task" data-task="วิเคราะห์ทางเลือกและความเสี่ยง">⚠️ ทางเลือกและความเสี่ยง</button><button class="task" data-task="จัดทำ Dashboard สำหรับผู้บริหาร">📊 Dashboard</button><button class="task" data-task="สรุปรายงานการประชุมเพื่อผู้บริหาร">📝 สรุปประชุม</button><button class="task" data-task="ร่างคำกล่าวเปิดงานหรือปิดงาน">🎤 คำกล่าว</button><button class="task" data-task="ร่างสารหรือข้อความผู้บริหาร">💬 สารผู้บริหาร</button><button class="task" data-task="เตรียมประเด็นประชุมและข้อสั่งการ">📌 ประเด็นประชุม</button><button class="task" data-task="ติดตามผลการดำเนินงานตามข้อสั่งการ">📈 ติดตามข้อสั่งการ</button><button class="task" data-task="วิเคราะห์ข้อมูลเพื่อการตัดสินใจ">🧭 วิเคราะห์ตัดสินใจ</button><button class="task" data-task="ร่างคำชี้แจงหรือคำตอบต่อสภาและประชาชน">🏛️ คำชี้แจง</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="grid"><div class="field"><label>หน่วยงาน</label><input id="agency"><button class="mic" data-target="agency">🎤</button></div><div class="field"><label>ระดับผู้บริหาร/ผู้รับ</label><input id="audience"><button class="mic" data-target="audience">🎤</button></div><div class="field full"><label>เรื่อง</label><input id="subject"><button class="mic" data-target="subject">🎤</button></div><div class="field full"><label>ข้อเท็จจริงและสถานการณ์</label><textarea id="facts"></textarea><button class="mic" data-target="facts">🎤</button></div><div class="field full"><label>ข้อมูล ตัวเลข หรือผลการดำเนินงาน</label><textarea id="data"></textarea><button class="mic" data-target="data">🎤</button></div><div class="field full"><label>ปัญหา ความเสี่ยง หรือข้อจำกัด</label><textarea id="risks"></textarea><button class="mic" data-target="risks">🎤</button></div><div class="field full"><label>ทางเลือกหรือข้อเสนอ</label><textarea id="options"></textarea><button class="mic" data-target="options">🎤</button></div><div class="field full"><label>ผลลัพธ์และรูปแบบที่ต้องการ</label><textarea id="result"></textarea><button class="mic" data-target="result">🎤</button></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">AI ช่วยสรุปและจัดโครงสร้าง ผู้บริหารและเจ้าหน้าที่ต้องตรวจสอบข้อเท็จจริง ตัวเลข ฐานอำนาจ และผลกระทบก่อนตัดสินใจ</div></section></main><script>let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');document.querySelectorAll('.mic').forEach(btn=>btn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('ไมโครโฟนรองรับดีที่สุดบน Chrome หรือ Edge');const target=$(btn.dataset.target),r=new SR();r.lang='th-TH';btn.classList.add('listening');r.onresult=e=>target.value+=(target.value?' ':'')+e.results[0][0].transcript;r.onerror=()=>alert('ไม่สามารถรับเสียงได้ กรุณาตรวจสิทธิ์ไมโครโฟน');r.onend=()=>btn.classList.remove('listening');r.start()});$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot สำหรับผู้บริหารองค์กรปกครองส่วนท้องถิ่น เชี่ยวชาญการสรุป วิเคราะห์ และสนับสนุนการตัดสินใจ\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- ระดับผู้บริหาร/ผู้รับ: ${val('audience')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริงและสถานการณ์: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- ข้อมูล/ตัวเลข/ผลการดำเนินงาน: ${val('data')||'[ยังไม่ได้ระบุ]'}\n- ปัญหา ความเสี่ยง หรือข้อจำกัด: ${val('risks')||'[ยังไม่ได้ระบุ]'}\n- ทางเลือกหรือข้อเสนอ: ${val('options')||'[ยังไม่ได้ระบุ]'}\n- ผลลัพธ์และรูปแบบที่ต้องการ: ${val('result')||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- แยกข้อเท็จจริง การวิเคราะห์ ทางเลือก ความเสี่ยง และข้อเสนอเพื่อการตัดสินใจ\n- ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน ตัวเลข หรือข้อกฎหมาย\n- ระบุข้อมูลสำคัญที่ยังขาดและเงื่อนไขก่อนตัดสินใจ\n- ใช้ภาษากระชับ อ่านง่าย เหมาะกับผู้บริหาร\n- ตรวจ PDPA และหลีกเลี่ยงข้อมูลส่วนบุคคลที่ไม่จำเป็น\n- ย้ำให้ตรวจสอบข้อเท็จจริงและฐานอำนาจก่อนใช้จริง`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
