<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยงานสารบรรณ | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 86px}h1{font-size:25px}.search,input,textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:96px}.list,.grid,.io{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task,.io label,.io button{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}.io{margin:12px 0}.io label,.io button{cursor:pointer;font-weight:700}.io input{display:none}.files{font-size:12px;color:#566b84;margin:4px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid,.io{grid-template-columns:1fr}.wrap{padding-bottom:30px}}</style></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>📄 ผู้ช่วยงานสารบรรณ</h1><input class="search" id="filter" placeholder="ค้นหาประเภทงาน"><section class="list" id="tasks"><button class="task" data-task="หนังสือภายนอก">📄 หนังสือภายนอก</button><button class="task" data-task="หนังสือภายใน">📃 หนังสือภายใน</button><button class="task" data-task="บันทึกข้อความ">📝 บันทึกข้อความ</button><button class="task" data-task="คำสั่ง">📋 คำสั่ง</button><button class="task" data-task="ประกาศ">📢 ประกาศ</button><button class="task" data-task="หนังสือหารือ">⚖️ หนังสือหารือ</button><button class="task" data-task="หนังสือเชิญประชุม">📨 หนังสือเชิญประชุม</button><button class="task" data-task="หนังสือนำส่ง">📦 หนังสือนำส่ง</button><button class="task" data-task="รายงานการประชุม">📚 รายงานการประชุม</button><button class="task" data-task="ตรวจหนังสือราชการ">✅ ตรวจหนังสือราชการ</button><button class="task" data-task="ตรวจ PDPA">🔒 ตรวจ PDPA</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="io"><label>📎 แนบเอกสาร<input id="files" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,image/*"></label><label>📷 ถ่ายรูป<input id="camera" type="file" accept="image/*" capture="environment"></label><button type="button" id="voice">🎤 พูดข้อมูล</button></div><div class="files" id="fileList">ยังไม่ได้เลือกไฟล์</div><div class="grid"><div><label>หน่วยงานเจ้าของเรื่อง</label><input id="agency"></div><div><label>เรียน / ผู้รับ</label><input id="receiver"></div><div class="full"><label>เรื่อง</label><input id="subject"></div><div class="full"><label>ข้อเท็จจริง</label><textarea id="facts"></textarea></div><div class="full"><label>เหตุผลและความจำเป็น</label><textarea id="reasons"></textarea></div><div class="full"><label>กฎหมาย/ระเบียบ/เอกสารอ้างอิง</label><textarea id="law"></textarea></div><div class="full"><label>วัตถุประสงค์หรือข้อเสนอ</label><textarea id="objective"></textarea></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">ไฟล์และภาพยังไม่ถูกส่งออกจากเว็บอัตโนมัติ กรุณาแนบไฟล์เดียวกันใน ChatGPT/Gemini หลังคัดลอก Prompt และหลีกเลี่ยงข้อมูลส่วนบุคคลที่ไม่จำเป็น</div></section></main><script>let task='',names=[];const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');function add(fs){names=[...new Set(names.concat([...fs].map(f=>f.name)))];$('fileList').textContent=names.length?'ไฟล์ที่เลือก: '+names.join(', '):'ยังไม่ได้เลือกไฟล์'}$('files').onchange=e=>add(e.target.files);$('camera').onchange=e=>add(e.target.files);$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('อุปกรณ์นี้ยังไม่รองรับการพูด กรุณาพิมพ์แทน');return}const r=new SR();r.lang='th-TH';r.onresult=e=>{$('facts').value+=($('facts').value?'\n':'')+e.results[0][0].transcript};r.start()};$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานสารบรรณราชการไทย\n\nภารกิจ\nจัดทำ${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- เรียน/ผู้รับ: ${val('receiver')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- เหตุผลและความจำเป็น: ${val('reasons')||'[ยังไม่ได้ระบุ]'}\n- กฎหมาย/ระเบียบ/เอกสารอ้างอิง: ${val('law')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- วัตถุประสงค์หรือข้อเสนอ: ${val('objective')||'[ยังไม่ได้ระบุ]'}\n- เอกสารที่ผู้ใช้จะอัปโหลดเพิ่มในแชต: ${names.length?names.join(', '):'[ไม่มี]'}\n\nข้อกำหนด\n- ใช้ข้อเท็จจริงและเอกสารแนบเป็นหลัก ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน หรือข้อกฎหมาย\n- ตรวจ PDPA รูปแบบงานสารบรรณ ภาษาราชการ และข้อมูลสำคัญที่ขาด\n- ระบุ [ต้องตรวจสอบ/เพิ่มเติม] เมื่อข้อมูลไม่ครบ\n- ผู้ใช้ต้องตรวจทานก่อนนำไปใช้จริง`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script></body></html>
