<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75">
<title>ผู้ช่วยงานสารบรรณ | GovPrompt Thailand</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;color:#0b3b75;text-decoration:none}.back{text-decoration:none;color:#51647d}.wrap{max-width:980px;margin:auto;padding:16px 14px 90px}h1{font-size:25px;margin:4px 0 14px}.search{width:100%;padding:12px 14px;border:1px solid #dbe4ef;border-radius:12px;font-size:16px;margin-bottom:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid #dbe4ef;background:#fff;border-radius:999px;padding:8px 12px}.tabs button.active{background:#0b3b75;color:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:13px;text-align:left;font:inherit;min-height:62px;display:flex;align-items:center;gap:10px}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.task span:first-child{font-size:22px}.task strong{display:block}.task small{color:#6f7e92}.generator{margin-top:18px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.section-title{margin:14px 0 4px;font-size:15px;color:#0b3b75}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:10px 0 6px}input,textarea,select{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:100px;resize:vertical}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.check{display:flex;gap:8px;align-items:flex-start;background:#f6f9fc;border:1px solid #e2e8f0;border-radius:10px;padding:10px}.check input{width:auto;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7;color:#19334f}.output{margin-top:12px;background:#f3f7fb;border-radius:10px;padding:12px;white-space:pre-wrap;display:none}.note{margin-top:12px;color:#65758b;font-size:12px}.bottom{display:none}
@media(max-width:700px){.list,.grid,.checks{grid-template-columns:1fr}.task small{display:none}.wrap{padding-bottom:80px}.bottom{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe6ef;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom a{text-align:center;text-decoration:none;color:#52647a;font-size:11px}.bottom span{display:block;font-size:20px}}
</style>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="index.html">GovPrompt Thailand</a><a class="back" href="index.html">← ผู้ช่วยทั้งหมด</a></div></header>
<main class="wrap">
<h1>📄 ผู้ช่วยงานสารบรรณ</h1>
<input class="search" id="filter" placeholder="ค้นหา เช่น หนังสือภายนอก คำสั่ง ประชุม">
<div class="tabs"><button class="active" data-group="all">ทั้งหมด</button><button data-group="draft">ร่าง</button><button data-group="contact">ติดต่อราชการ</button><button data-group="report">รายงาน</button><button data-group="check">ตรวจสอบ</button></div>
<section class="list" id="tasks">
<button class="task" data-group="draft" data-task="หนังสือภายนอก"><span>📄</span><span><strong>หนังสือภายนอก</strong><small>ถึงหน่วยงานหรือบุคคลภายนอก</small></span></button>
<button class="task" data-group="draft" data-task="หนังสือภายใน"><span>📃</span><span><strong>หนังสือภายใน</strong><small>ติดต่อภายในส่วนราชการ</small></span></button>
<button class="task" data-group="draft" data-task="บันทึกข้อความ"><span>📝</span><span><strong>บันทึกข้อความ</strong><small>เสนอข้อเท็จจริงและความเห็น</small></span></button>
<button class="task" data-group="draft" data-task="คำสั่ง"><span>📋</span><span><strong>คำสั่ง</strong><small>ร่างคำสั่งราชการ</small></span></button>
<button class="task" data-group="draft" data-task="ประกาศ"><span>📢</span><span><strong>ประกาศ</strong><small>ร่างประกาศราชการ</small></span></button>
<button class="task" data-group="contact" data-task="หนังสือหารือ"><span>⚖️</span><span><strong>หนังสือหารือ</strong><small>ข้อเท็จจริง ประเด็น และคำถาม</small></span></button>
<button class="task" data-group="contact" data-task="หนังสือเชิญประชุม"><span>📨</span><span><strong>หนังสือเชิญประชุม</strong><small>วัน เวลา สถานที่ วาระ</small></span></button>
<button class="task" data-group="contact" data-task="หนังสือนำส่ง"><span>📦</span><span><strong>หนังสือนำส่ง</strong><small>นำส่งเอกสารหรือหลักฐาน</small></span></button>
<button class="task" data-group="report" data-task="รายงานการประชุม"><span>📚</span><span><strong>รายงานการประชุม</strong><small>สรุปวาระ มติ และผู้รับผิดชอบ</small></span></button>
<button class="task" data-group="check" data-task="ตรวจหนังสือราชการ"><span>✅</span><span><strong>ตรวจหนังสือราชการ</strong><small>รูปแบบ ภาษา และข้อมูลขาด</small></span></button>
<button class="task" data-group="check" data-task="ตรวจ PDPA"><span>🔒</span><span><strong>ตรวจ PDPA</strong><small>ข้อมูลส่วนบุคคลและความจำเป็น</small></span></button>
</section>
<section class="generator" id="generator">
<strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong>
<h2 class="section-title">ข้อมูลหนังสือ</h2>
<div class="grid">
<div><label for="agency">หน่วยงานเจ้าของเรื่อง</label><input id="agency" placeholder="เช่น องค์การบริหารส่วนจังหวัด..."></div>
<div><label for="bookno">เลขที่หนังสือ (ถ้ามี)</label><input id="bookno" placeholder="เช่น พย 51001/..."></div>
<div><label for="date">วันที่ (ถ้ามี)</label><input id="date" placeholder="หากไม่ทราบให้เว้นไว้"></div>
<div><label for="receiver">เรียน / ผู้รับ</label><input id="receiver" placeholder="เช่น ผู้ว่าราชการจังหวัด..."></div>
<div class="full"><label for="subject">เรื่อง</label><input id="subject" placeholder="ระบุชื่อเรื่อง"></div>
<div class="full"><label for="attachments">สิ่งที่ส่งมาด้วย / เอกสารแนบ</label><input id="attachments" placeholder="ระบุรายการ หรือพิมพ์ว่า ไม่มี"></div>
</div>
<h2 class="section-title">เนื้อหา</h2>
<div class="grid">
<div class="full"><label for="facts">ข้อเท็จจริง</label><textarea id="facts" placeholder="ลำดับเหตุการณ์ บุคคล/หน่วยงานที่เกี่ยวข้อง และข้อมูลสำคัญ"></textarea></div>
<div class="full"><label for="reasons">เหตุผลและความจำเป็น</label><textarea id="reasons" placeholder="เหตุผลที่ต้องจัดทำหนังสือหรือดำเนินการ"></textarea></div>
<div class="full"><label for="law">กฎหมาย/ระเบียบ/เอกสารอ้างอิง (ถ้ามี)</label><textarea id="law" placeholder="หากไม่ทราบให้เว้นไว้ ระบบจะไม่สมมติ"></textarea></div>
<div class="full"><label for="objective">วัตถุประสงค์หรือข้อเสนอ</label><textarea id="objective" placeholder="ต้องการขออนุมัติ ขอหารือ ขอความร่วมมือ แจ้งผล หรือเสนอให้พิจารณาอย่างไร"></textarea></div>
</div>
<h2 class="section-title">การตรวจสอบก่อนสร้าง</h2>
<div class="checks">
<label class="check"><input type="checkbox" id="pdpa" checked><span>ตรวจ PDPA และตัดข้อมูลส่วนบุคคลที่ไม่จำเป็น</span></label>
<label class="check"><input type="checkbox" id="format" checked><span>ตรวจรูปแบบงานสารบรรณ</span></label>
<label class="check"><input type="checkbox" id="language" checked><span>ตรวจภาษาราชการและคำผิด</span></label>
<label class="check"><input type="checkbox" id="authority"><span>ตรวจอำนาจหน้าที่และฐานกฎหมาย</span></label>
</div>
<div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้างข้อมูล</button></div>
<div class="output" id="output"></div>
<div class="note">กรุณาหลีกเลี่ยงข้อมูลส่วนบุคคลที่ไม่จำเป็น และตรวจทานผลลัพธ์ก่อนใช้จริง</div>
</section>
</main>
<nav class="bottom"><a href="index.html"><span>🏠</span>หน้าแรก</a><a href="#filter"><span>🔎</span>ค้นหา</a><a href="#generator"><span>✍️</span>สร้าง</a></nav>
<script>
let task='';const tasks=[...document.querySelectorAll('.task')],tabs=[...document.querySelectorAll('.tabs button')];
tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('selected').textContent='งานที่เลือก: '+task;document.getElementById('generator').scrollIntoView({behavior:'smooth'})});
tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');const g=b.dataset.group;tasks.forEach(x=>x.style.display=g==='all'||x.dataset.group===g?'flex':'none')});
document.getElementById('filter').oninput=e=>{const q=e.target.value.toLowerCase();tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')};
const val=id=>document.getElementById(id).value.trim();
document.getElementById('make').onclick=()=>{if(!task){alert('กรุณาเลือกงานก่อน');return}const checks=[];if(document.getElementById('pdpa').checked)checks.push('ตรวจ PDPA และตัดข้อมูลส่วนบุคคลที่ไม่จำเป็น');if(document.getElementById('format').checked)checks.push('ตรวจรูปแบบงานสารบรรณ');if(document.getElementById('language').checked)checks.push('ตรวจภาษาราชการและคำผิด');if(document.getElementById('authority').checked)checks.push('ตรวจอำนาจหน้าที่และฐานกฎหมาย');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานสารบรรณราชการไทย\n\nภารกิจ\nจัดทำ${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงานเจ้าของเรื่อง: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- เลขที่หนังสือ: ${val('bookno')||'[ยังไม่ได้ระบุ]'}\n- วันที่: ${val('date')||'[ยังไม่ได้ระบุ]'}\n- เรียน / ผู้รับ: ${val('receiver')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- สิ่งที่ส่งมาด้วย: ${val('attachments')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- เหตุผลและความจำเป็น: ${val('reasons')||'[ยังไม่ได้ระบุ]'}\n- กฎหมาย/ระเบียบ/เอกสารอ้างอิง: ${val('law')||'[ยังไม่ได้ระบุ]'}\n- วัตถุประสงค์หรือข้อเสนอ: ${val('objective')||'[ยังไม่ได้ระบุ]'}\n\nรายการตรวจสอบ\n- ${checks.join('\n- ')||'ไม่มีรายการตรวจเพิ่มเติม'}\n\nข้อกำหนดสำคัญ\n1. ใช้ข้อเท็จจริงและเอกสารที่ผู้ใช้ให้เป็นหลัก\n2. ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน หรือข้อกฎหมาย\n3. หากข้อมูลสำคัญไม่ครบ ให้ระบุ [ต้องตรวจสอบ/เพิ่มเติม]\n4. จัดรูปแบบให้เหมาะกับประเภทหนังสือและงานสารบรรณราชการ\n5. แยกข้อเท็จจริง เหตุผล ข้อกฎหมาย และข้อเสนอให้ชัดเจนเมื่อเกี่ยวข้อง\n6. คำนึงถึง PDPA และปกปิดข้อมูลที่ไม่จำเป็น\n7. เตือนให้ผู้ใช้ตรวจทานก่อนนำไปใช้จริง`;const o=document.getElementById('output');o.textContent=text;o.style.display='block'};
document.getElementById('copy').onclick=async()=>{const t=document.getElementById('output').textContent;if(!t){alert('กรุณาสร้าง Prompt ก่อน');return}await navigator.clipboard.writeText(t);alert('คัดลอกแล้ว')};
document.getElementById('clear').onclick=()=>{document.querySelectorAll('.generator input,.generator textarea').forEach(x=>x.value='');document.getElementById('output').style.display='none'};
</script>
</body></html>
