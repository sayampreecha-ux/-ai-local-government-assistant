<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75">
<title>ผู้ช่วยงานสารบรรณ | GovPrompt Thailand</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:900px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;color:#0b3b75;text-decoration:none}.back{text-decoration:none;color:#51647d}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}h1{font-size:25px;margin:4px 0 14px}.search{width:100%;padding:12px 14px;border:1px solid #dbe4ef;border-radius:12px;font-size:16px;margin-bottom:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid #dbe4ef;background:#fff;border-radius:999px;padding:8px 12px}.tabs button.active{background:#0b3b75;color:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:13px;text-align:left;font:inherit;min-height:62px;display:flex;align-items:center;gap:10px}.task span:first-child{font-size:22px}.task strong{display:block}.task small{color:#6f7e92}.generator{margin-top:18px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}label{display:block;font-weight:700;margin:10px 0 6px}input,textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit}textarea{min-height:115px;resize:vertical}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7;color:#19334f}.output{margin-top:12px;background:#f3f7fb;border-radius:10px;padding:12px;white-space:pre-wrap;display:none}.note{margin-top:12px;color:#65758b;font-size:12px}.bottom{display:none}
@media(max-width:600px){.list{grid-template-columns:1fr}.task small{display:none}.wrap{padding-bottom:80px}.bottom{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe6ef;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom a{text-align:center;text-decoration:none;color:#52647a;font-size:11px}.bottom span{display:block;font-size:20px}}
</style>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="index.html">GovPrompt Thailand</a><a class="back" href="index.html">← ผู้ช่วยทั้งหมด</a></div></header>
<main class="wrap">
<h1>📄 ผู้ช่วยงานสารบรรณ</h1>
<input class="search" id="filter" placeholder="ค้นหา เช่น หนังสือภายนอก คำสั่ง ประชุม">
<div class="tabs"><button class="active" data-group="all">ทั้งหมด</button><button data-group="draft">ร่าง</button><button data-group="contact">ติดต่อราชการ</button><button data-group="report">รายงาน</button><button data-group="check">ตรวจสอบ</button></div>
<section class="list" id="tasks">
<button class="task" data-group="draft" data-task="หนังสือภายนอก"><span>📄</span><span><strong>หนังสือภายนอก</strong><small>ถึงหน่วยงานหรือบุคคลภายนอก</small></span></button>
<button class="task" data-group="draft" data-task="หนังสือภายใน"><span>📃</span><span><strong>หนังสือภายใน</strong><small>ติดต่อภายในส่วนราชการ</small></span></button>
<button class="task" data-group="draft" data-task="บันทึกข้อความ"><span>📝</span><span><strong>บันทึกข้อความ</strong><small>เสนอข้อเท็จจริงและความเห็น</small></span></button>
<button class="task" data-group="draft" data-task="คำสั่ง"><span>📋</span><span><strong>คำสั่ง</strong><small>ร่างคำสั่งราชการ</small></span></button>
<button class="task" data-group="draft" data-task="ประกาศ"><span>📢</span><span><strong>ประกาศ</strong><small>ร่างประกาศราชการ</small></span></button>
<button class="task" data-group="contact" data-task="หนังสือหารือ"><span>⚖️</span><span><strong>หนังสือหารือ</strong><small>ข้อเท็จจริง ประเด็น และคำถาม</small></span></button>
<button class="task" data-group="contact" data-task="หนังสือเชิญประชุม"><span>📨</span><span><strong>หนังสือเชิญประชุม</strong><small>วัน เวลา สถานที่ วาระ</small></span></button>
<button class="task" data-group="contact" data-task="หนังสือนำส่ง"><span>📦</span><span><strong>หนังสือนำส่ง</strong><small>นำส่งเอกสารหรือหลักฐาน</small></span></button>
<button class="task" data-group="report" data-task="รายงานการประชุม"><span>📚</span><span><strong>รายงานการประชุม</strong><small>สรุปวาระ มติ และผู้รับผิดชอบ</small></span></button>
<button class="task" data-group="check" data-task="ตรวจหนังสือราชการ"><span>✅</span><span><strong>ตรวจหนังสือราชการ</strong><small>รูปแบบ ภาษา และข้อมูลขาด</small></span></button>
<button class="task" data-group="check" data-task="ตรวจ PDPA"><span>🔒</span><span><strong>ตรวจ PDPA</strong><small>ข้อมูลส่วนบุคคลและความจำเป็น</small></span></button>
</section>
<section class="generator" id="generator">
<strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong>
<label for="subject">เรื่อง</label><input id="subject" placeholder="ระบุชื่อเรื่อง">
<label for="details">รายละเอียดหรือข้อเท็จจริง</label><textarea id="details" placeholder="พิมพ์ข้อเท็จจริง วัตถุประสงค์ ผู้รับ และข้อมูลสำคัญ"></textarea>
<div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button></div>
<div class="output" id="output"></div>
<div class="note">กรุณาหลีกเลี่ยงข้อมูลส่วนบุคคลที่ไม่จำเป็น และตรวจทานผลลัพธ์ก่อนใช้จริง</div>
</section>
</main>
<nav class="bottom"><a href="index.html"><span>🏠</span>หน้าแรก</a><a href="#filter"><span>🔎</span>ค้นหา</a><a href="#generator"><span>✍️</span>สร้าง</a></nav>
<script>
let task='';const tasks=[...document.querySelectorAll('.task')],tabs=[...document.querySelectorAll('.tabs button')];
tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;document.getElementById('selected').textContent='งานที่เลือก: '+task;document.getElementById('generator').scrollIntoView({behavior:'smooth'})});
tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');const g=b.dataset.group;tasks.forEach(x=>x.style.display=g==='all'||x.dataset.group===g?'flex':'none')});
document.getElementById('filter').oninput=e=>{const q=e.target.value.toLowerCase();tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')};
document.getElementById('make').onclick=()=>{const s=document.getElementById('subject').value.trim(),d=document.getElementById('details').value.trim();if(!task){alert('กรุณาเลือกงานก่อน');return}const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานสารบรรณราชการไทย\n\nภารกิจ\nจัดทำ${task}\n\nข้อมูลจากผู้ใช้\n- เรื่อง: ${s||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง/รายละเอียด: ${d||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- ใช้ข้อเท็จจริงที่ให้เป็นหลัก ไม่สมมติชื่อบุคคล วันที่ เลขหนังสือ หรือข้อกฎหมาย\n- หากข้อมูลสำคัญไม่ครบ ให้ระบุข้อมูลที่ต้องตรวจสอบเพิ่มเติม\n- ใช้ภาษาราชการ กระชับ ชัดเจน\n- คำนึงถึงการคุ้มครองข้อมูลส่วนบุคคล\n- เตือนให้ผู้ใช้ตรวจทานก่อนนำไปใช้จริง`;const o=document.getElementById('output');o.textContent=text;o.style.display='block'};
document.getElementById('copy').onclick=async()=>{const t=document.getElementById('output').textContent;if(!t){alert('กรุณาสร้าง Prompt ก่อน');return}await navigator.clipboard.writeText(t);alert('คัดลอกแล้ว')};
</script>
</body></html>
