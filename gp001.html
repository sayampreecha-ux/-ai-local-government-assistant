<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยงานสารบรรณ | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 60px}h1{font-size:25px}.search{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}.voice-wrap{display:flex;gap:6px;align-items:stretch}.voice-wrap input,.voice-wrap textarea{flex:1;min-width:0;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}.voice-wrap textarea{min-height:96px;resize:vertical}.mic{width:46px;border:1px solid #cbd8e7;border-radius:10px;background:#edf4fb;font-size:20px;cursor:pointer}.mic.listening{background:#d7263d;color:#fff;border-color:#d7263d;animation:pulse 1s infinite}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@keyframes pulse{50%{opacity:.65}}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}.wrap{padding-bottom:30px}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>📄 ผู้ช่วยงานสารบรรณ</h1><input class="search" id="filter" placeholder="ค้นหาประเภทงาน"><section class="list" id="tasks"><button class="task" data-task="หนังสือภายนอก">📄 หนังสือภายนอก</button><button class="task" data-task="หนังสือภายใน">📃 หนังสือภายใน</button><button class="task" data-task="บันทึกข้อความ">📝 บันทึกข้อความ</button><button class="task" data-task="คำสั่ง">📋 คำสั่ง</button><button class="task" data-task="ประกาศ">📢 ประกาศ</button><button class="task" data-task="หนังสือหารือ">⚖️ หนังสือหารือ</button><button class="task" data-task="หนังสือเชิญประชุม">📨 หนังสือเชิญประชุม</button><button class="task" data-task="หนังสือนำส่ง">📦 หนังสือนำส่ง</button><button class="task" data-task="รายงานการประชุม">📚 รายงานการประชุม</button><button class="task" data-task="ตรวจหนังสือราชการ">✅ ตรวจหนังสือราชการ</button><button class="task" data-task="ตรวจ PDPA">🔒 ตรวจ PDPA</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="grid"><div><label>หน่วยงานเจ้าของเรื่อง</label><input id="agency"></div><div><label>เรียน / ผู้รับ</label><input id="receiver"></div><div class="full"><label>เรื่อง</label><input id="subject"></div><div class="full"><label>ข้อเท็จจริง</label><textarea id="facts"></textarea></div><div class="full"><label>เหตุผลและความจำเป็น</label><textarea id="reasons"></textarea></div><div class="full"><label>กฎหมาย/ระเบียบ/เอกสารอ้างอิง</label><textarea id="law"></textarea></div><div class="full"><label>วัตถุประสงค์หรือข้อเสนอ</label><textarea id="objective"></textarea></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">กด 🎤 ข้างช่องที่ต้องการแล้วพูด ระบบจะเติมข้อความลงในช่องนั้น</div></section></main><script>let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');function addVoice(){document.querySelectorAll('input:not(.search),textarea').forEach(el=>{if(el.dataset.voice)return;el.dataset.voice='1';const w=document.createElement('div');w.className='voice-wrap';el.parentNode.insertBefore(w,el);w.appendChild(el);const b=document.createElement('button');b.type='button';b.className='mic';b.textContent='🎤';b.title='พูดเพื่อกรอกช่องนี้';w.appendChild(b);b.onclick=()=>startVoice(el,b)})}function startVoice(el,b){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('เบราว์เซอร์นี้ยังไม่รองรับการพิมพ์ด้วยเสียง');return}const r=new SR();r.lang='th-TH';r.interimResults=false;r.continuous=false;b.classList.add('listening');b.textContent='⏹';r.onresult=e=>{const t=e.results[0][0].transcript.trim();el.value+=(el.value.trim()?' ':'')+t;el.dispatchEvent(new Event('input',{bubbles:true}))};r.onerror=()=>alert('รับเสียงไม่สำเร็จ กรุณาลองใหม่');r.onend=()=>{b.classList.remove('listening');b.textContent='🎤'};r.start()}addVoice();$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานสารบรรณราชการไทย\n\nภารกิจ\nจัดทำ${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- เรียน/ผู้รับ: ${val('receiver')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- เหตุผลและความจำเป็น: ${val('reasons')||'[ยังไม่ได้ระบุ]'}\n- กฎหมาย/ระเบียบ/เอกสารอ้างอิง: ${val('law')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- วัตถุประสงค์หรือข้อเสนอ: ${val('objective')||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- ใช้ข้อเท็จจริงเป็นหลัก ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน หรือข้อกฎหมาย\n- ตรวจ PDPA รูปแบบงานสารบรรณ ภาษาราชการ และข้อมูลสำคัญที่ขาด\n- ระบุ [ต้องตรวจสอบ/เพิ่มเติม] เมื่อข้อมูลไม่ครบ`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
