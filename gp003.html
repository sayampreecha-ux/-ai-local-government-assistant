<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยพัสดุและตรวจ TOR | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px}h1{font-size:25px}.list,.grid,.io{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task,.io label,.io button{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}input,textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit}textarea{min-height:100px}.io{margin:12px 0}.io label,.io button{cursor:pointer;font-weight:700}.io input{display:none}.files{font-size:12px;color:#566b84}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid,.io{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>📦 ผู้ช่วยพัสดุและตรวจ TOR</h1><section class="list"><button class="task" data-task="ตรวจ TOR แบบครบวงจร">ตรวจ TOR</button><button class="task" data-task="ร่าง TOR">ร่าง TOR</button><button class="task" data-task="ตรวจ TOR ครุภัณฑ์">TOR ครุภัณฑ์</button><button class="task" data-task="ตรวจ TOR งานก่อสร้าง">TOR ก่อสร้าง</button><button class="task" data-task="ตรวจ TOR งานจ้างที่ปรึกษา">TOR จ้างที่ปรึกษา</button><button class="task" data-task="ตรวจ TOR งานจ้างบริการ">TOR จ้างบริการ</button><button class="task" data-task="ตรวจราคากลางและ BOQ">ราคากลาง / BOQ</button><button class="task" data-task="ตรวจคุณสมบัติผู้ยื่นข้อเสนอ">คุณสมบัติ</button><button class="task" data-task="ตรวจสัญญาและการตรวจรับ">สัญญา / ตรวจรับ</button><button class="task" data-task="ตรวจความเสี่ยงล็อกสเปกและการแข่งขัน">ความเสี่ยงล็อกสเปก</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="io"><label>📎 แนบเอกสาร<input id="files" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,image/*"></label><label>📷 ถ่ายรูป<input id="camera" type="file" accept="image/*" capture="environment"></label><button id="voice">🎤 พูดข้อมูล</button></div><div class="files" id="fileList">ยังไม่ได้เลือกไฟล์</div><div class="grid"><div><label>พัสดุ/งานที่จะจัดหา</label><input id="item"></div><div><label>วงเงิน</label><input id="budget"></div><div class="full"><label>ความต้องการใช้งาน</label><textarea id="need"></textarea></div><div class="full"><label>ข้อความ TOR / ประเด็นสำคัญ</label><textarea id="tor"></textarea></div><div class="full"><label>จุดที่กังวล</label><textarea id="risk"></textarea></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" onclick="location.reload()">ล้าง</button></div><div class="output" id="output"></div><div class="note">หลังคัดลอก Prompt ให้แนบ TOR/BOQ/สัญญา/ภาพเดียวกันใน ChatGPT หรือ Gemini เพื่อวิเคราะห์เนื้อหาจริง</div></section></main><script>let task='',names=[];const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});function add(fs){names=[...new Set(names.concat([...fs].map(f=>f.name)))];$('fileList').textContent=names.length?'ไฟล์ที่เลือก: '+names.join(', '):'ยังไม่ได้เลือกไฟล์'}$('files').onchange=e=>add(e.target.files);$('camera').onchange=e=>add(e.target.files);$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('อุปกรณ์นี้ยังไม่รองรับการพูด');const r=new SR();r.lang='th-TH';r.onresult=e=>{$('need').value+=($('need').value?'\n':'')+e.results[0][0].transcript};r.start()};$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานพัสดุและการจัดซื้อจัดจ้างภาครัฐ\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- พัสดุ/งานที่จะจัดหา: ${val('item')||'[ยังไม่ได้ระบุ]'}\n- วงเงิน: ${val('budget')||'[ยังไม่ได้ระบุ]'}\n- ความต้องการใช้งาน: ${val('need')||'[ยังไม่ได้ระบุ]'}\n- ข้อความ TOR/ประเด็นสำคัญ: ${val('tor')||'[ยังไม่ได้ระบุ]'}\n- จุดที่กังวล: ${val('risk')||'[ยังไม่ได้ระบุ]'}\n- เอกสารที่จะอัปโหลดเพิ่ม: ${names.length?names.join(', '):'[ไม่มี]'}\n\nข้อกำหนด\n- ใช้ TOR เอกสารแนบ และข้อเท็จจริงเป็นหลัก ห้ามสมมติยี่ห้อ รุ่น ผู้ขาย วงเงิน วันที่ เลขหนังสือ หรือข้อกฎหมาย\n- ตรวจการชี้เฉพาะ การแข่งขัน คุณสมบัติ ผลงาน บุคลากร ราคากลาง BOQ สัญญา ส่งมอบ ตรวจรับ รับประกัน ค่าปรับ และ PDPA\n- ทำตาราง ข้อ TOR/ความเสี่ยง/เหตุผล/ข้อความเสนอแก้/หลักฐาน\n- ระบุข้อมูลที่ต้องตรวจสอบเพิ่มเติมก่อนใช้จริง`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};</script></body></html>
