<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a5b42">
  <title>วันเพจลูกน้ำยุงลาย | GovPrompt Thailand</title>
  <link rel="stylesheet" href="assets/css/govprompt.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f4f9f7;color:#12372a}
    .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dce9e3}.bar{max-width:980px;margin:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.bar a{text-decoration:none;color:#12372a;font-weight:750}
    .wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.hero{padding:18px;border-radius:18px;background:linear-gradient(135deg,#eaf8f2,#edf6ff);border:1px solid #cce2d8;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:clamp(23px,5vw,32px)}.hero p{margin:0;color:#51685e;line-height:1.6}
    #tasks{display:none}.generator{display:none}
  </style>
</head>
<body>
  <header class="top"><div class="bar"><a href="index.html">GovPrompt Thailand</a><a href="index.html">← กลับหน้าหลัก</a></div></header>
  <main class="wrap">
    <section class="hero">
      <h1>🦟 วันเพจผลสำรวจลูกน้ำยุงลาย</h1>
      <p>กรอกข้อมูล HI และ CI แล้วระบบคำนวณเปอร์เซ็นต์ ยอดรวม จุดสูงสุด และสร้างคำสั่งพร้อมใช้สำหรับทำอินโฟกราฟิกใน ChatGPT</p>
    </section>
    <section id="tasks"></section>
    <section class="generator"></section>
  </main>
  <script src="assets/js/features/mosquito-survey-onepage-v1.js?v=1.0.1"></script>
  <script>
    (()=>{
      const start=()=>{
        const button=document.querySelector('.mosq-task');
        const panel=document.getElementById('mosquitoOnepageTool');
        if(button) button.click();
        if(panel){panel.hidden=false;panel.scrollIntoView({block:'start'});}
      };
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
    })();
  </script>
</body>
</html>
