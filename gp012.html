<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยประชาสัมพันธ์ | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 60px}h1{font-size:25px;margin-bottom:6px}.intro{color:#65758b;margin:0 0 14px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:13px;text-align:left;font:inherit;min-height:58px;font-weight:650}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}label{display:block;font-weight:700;margin:9px 0 7px}textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:12px;font:inherit;background:#fff;min-height:125px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff;flex:1}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}.hint{font-size:13px;color:#65758b;margin-top:5px}@media(max-width:650px){.list{grid-template-columns:1fr}h1{font-size:24px}.primary{width:100%;flex-basis:100%}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>📢 ผู้ช่วยประชาสัมพันธ์</h1><p class="intro">เลือกสิ่งที่อยากทำ แล้วบอก GP สั้น ๆ ครั้งเดียว</p><section class="list" id="tasks"><button class="task" data-task="เขียนข่าวประชาสัมพันธ์">📰 เขียนข่าวประชาสัมพันธ์</button><button class="task" data-task="ทำโพสต์โซเชียล">📱 ทำโพสต์โซเชียล</button><button class="task" data-task="ทำอินโฟกราฟิก">🎨 ทำอินโฟกราฟิก</button><button class="task" data-task="ร่างสคริปต์ คำกล่าว หรือวิดีโอ">🎬 ร่างสคริปต์ / คำกล่าว / วิดีโอ</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><label for="request">อยากให้ GP ทำอะไร?</label><textarea id="request" placeholder="เช่น เขียนข่าวกิจกรรมปลูกต้นไม้ของ อบจ. วันนี้ที่กว๊านพะเยา ให้กระชับสำหรับ Facebook"></textarea><div class="hint">ใส่เท่าที่รู้ได้เลย เช่น เรื่องที่ทำ วัน/สถานที่ ชื่อบุคคล หรือข้อความสำคัญ — GP จะจัดรายละเอียดที่เหลือให้</div><div class="actions"><button class="btn primary" id="make">✨ สร้างคำสั่ง</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">ตรวจข้อเท็จจริง PDPA และความเหมาะสมก่อนเผยแพร่</div></section></main><script>let task='';const $=id=>document.getElementById(id),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+b.textContent.trim();$('request').focus()});$('make').onclick=()=>{if(!task)return alert('เลือกงานที่ต้องการก่อน');const request=$('request').value.trim();if(!request)return alert('บอก GP สั้น ๆ ว่าต้องการอะไร');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานประชาสัมพันธ์ภาครัฐและองค์กรปกครองส่วนท้องถิ่น\n\nงานที่ต้องทำ\n${task}\n\nคำขอจากผู้ใช้\n${request}\n\nวิธีทำ\n- เข้าใจเจตนาจากข้อความของผู้ใช้และจัดรูปแบบให้เหมาะสมโดยอัตโนมัติ\n- ใช้เฉพาะข้อเท็จจริงที่ผู้ใช้ให้ ห้ามแต่งชื่อบุคคล หน่วยงาน วันเวลา ตัวเลข หรือผลสำเร็จ\n- ถ้าข้อมูลสำคัญขาดและจำเป็นจริง ให้ถามเฉพาะจุดนั้น หรือระบุ [ต้องตรวจสอบ/เพิ่มเติม]\n- เลือกโครงสร้าง น้ำเสียง ความยาว และรูปแบบที่เหมาะกับงานให้เอง\n- ตรวจ PDPA ลิขสิทธิ์ ความเสี่ยงต่อชื่อเสียง และข้อมูลที่ยังไม่ยืนยัน\n- ส่งชิ้นงานพร้อมใช้ก่อน แล้วจึงแจ้งจุดที่ควรตรวจเท่าที่จำเป็น`; $('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('สร้างคำสั่งก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/prompt-registry.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/core/context-integration.js"></script><script src="assets/js/core/document-loader.js"></script><script src="assets/js/core/citation-engine.js"></script><script src="assets/js/core/knowledge-index.js"></script><script src="assets/js/core/semantic-search.js"></script><script src="assets/js/core/knowledge-engine.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
