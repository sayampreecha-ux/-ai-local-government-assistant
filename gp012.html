<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยประชาสัมพันธ์ | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 60px}h1{font-size:25px}.search,input,textarea,select{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:100px}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:13px;text-align:left;font:inherit;min-height:58px}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}.field{position:relative}.mic{position:absolute;right:7px;top:36px;border:0;background:#edf2f7;border-radius:8px;width:36px;height:34px;cursor:pointer}.field input,.field textarea{padding-right:48px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>📢 ผู้ช่วยประชาสัมพันธ์</h1><input class="search" id="filter" placeholder="ค้นหา เช่น ข่าว Facebook อินโฟกราฟิก วิดีโอ"><section class="list" id="tasks"><button class="task" data-task="เขียนข่าวประชาสัมพันธ์">📰 ข่าวประชาสัมพันธ์</button><button class="task" data-task="เขียนโพสต์ Facebook">📱 โพสต์ Facebook</button><button class="task" data-task="สรุปข่าวแบบ One Page">📄 One Page ข่าว</button><button class="task" data-task="สร้างเนื้อหาอินโฟกราฟิก">🎨 อินโฟกราฟิก</button><button class="task" data-task="เขียนสคริปต์วิดีโอสั้น">🎬 สคริปต์วิดีโอ</button><button class="task" data-task="เขียนข้อความเว็บไซต์">🌐 ข่าวเว็บไซต์</button><button class="task" data-task="ร่างคำบรรยายภาพกิจกรรม">🖼️ คำบรรยายภาพ</button><button class="task" data-task="จัดทำแผนประชาสัมพันธ์">📣 แผนประชาสัมพันธ์</button><button class="task" data-task="สื่อสารภาวะวิกฤต">🚨 สื่อสารภาวะวิกฤต</button><button class="task" data-task="ตรวจภาษาและความเสี่ยงก่อนเผยแพร่">✅ ตรวจข่าวก่อนเผยแพร่</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="grid"><div class="field"><label>หน่วยงาน</label><input id="agency"><button class="mic" data-target="agency">🎤</button></div><div class="field"><label>ช่องทางเผยแพร่</label><input id="channel" placeholder="เช่น Facebook เว็บไซต์ LINE"><button class="mic" data-target="channel">🎤</button></div><div class="full field"><label>หัวข้อ / ชื่อกิจกรรม</label><input id="subject"><button class="mic" data-target="subject">🎤</button></div><div class="full field"><label>ข้อเท็จจริงสำคัญ</label><textarea id="facts" placeholder="วัน เวลา สถานที่ ผู้เกี่ยวข้อง และสิ่งที่เกิดขึ้น"></textarea><button class="mic" data-target="facts">🎤</button></div><div class="full field"><label>สารสำคัญที่ต้องการสื่อ</label><textarea id="message"></textarea><button class="mic" data-target="message">🎤</button></div><div class="field"><label>กลุ่มเป้าหมาย</label><input id="audience"><button class="mic" data-target="audience">🎤</button></div><div class="field"><label>น้ำเสียง</label><input id="tone" placeholder="ทางการ กระชับ เป็นมิตร"><button class="mic" data-target="tone">🎤</button></div><div class="full field"><label>ข้อจำกัด / สิ่งที่ห้ามแสดง</label><textarea id="limits" placeholder="ข้อมูลส่วนบุคคล ภาพไม่เหมาะสม ข้อมูลที่ยังไม่ยืนยัน"></textarea><button class="mic" data-target="limits">🎤</button></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">ตรวจสอบข้อเท็จจริง ลิขสิทธิ์ภาพ PDPA และความเหมาะสมก่อนเผยแพร่ทุกครั้ง</div></section></main><script>let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');document.querySelectorAll('.mic').forEach(b=>b.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('ไมโครโฟนรองรับดีที่สุดบน Chrome หรือ Edge');const r=new SR();r.lang='th-TH';b.textContent='⏺';r.onresult=e=>{const t=$(b.dataset.target),s=e.results[0][0].transcript;t.value+=(t.value?' ':'')+s};r.onend=()=>b.textContent='🎤';r.onerror=()=>b.textContent='🎤';r.start()});$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานประชาสัมพันธ์ภาครัฐและองค์กรปกครองส่วนท้องถิ่น\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- ช่องทางเผยแพร่: ${val('channel')||'[ยังไม่ได้ระบุ]'}\n- หัวข้อ/กิจกรรม: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- สารสำคัญ: ${val('message')||'[ยังไม่ได้ระบุ]'}\n- กลุ่มเป้าหมาย: ${val('audience')||'[ยังไม่ได้ระบุ]'}\n- น้ำเสียง: ${val('tone')||'ทางการ กระชับ เข้าใจง่าย'}\n- ข้อจำกัด/สิ่งที่ห้ามแสดง: ${val('limits')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- ใช้เฉพาะข้อเท็จจริงที่ให้ ห้ามสมมติชื่อบุคคล วันเวลา ตัวเลข หรือผลสำเร็จ\n- จัดเนื้อหาให้เหมาะกับช่องทางและกลุ่มเป้าหมาย\n- ตรวจ PDPA ลิขสิทธิ์ ความเสี่ยงต่อชื่อเสียง และข้อมูลที่ยังไม่ยืนยัน\n- หากข้อมูลไม่ครบให้ระบุ [ต้องตรวจสอบ/เพิ่มเติม]\n- สร้างหัวเรื่อง เนื้อหา และแฮชแท็กเท่าที่จำเป็น\n- ห้ามใช้ถ้อยคำโอ้อวดเกินจริงหรือชี้นำทางการเมือง`; $('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/prompt-registry.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/core/context-integration.js"></script><script src="assets/js/core/document-loader.js"></script><script src="assets/js/core/knowledge-engine.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
