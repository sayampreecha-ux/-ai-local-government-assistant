name: Diagnose Budget Production
on:
  push:
    branches: ['diagnostic/v7-budget-production-e2e']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/diagnose-budget-production-e2e.mjs
