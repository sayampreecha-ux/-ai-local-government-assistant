name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/search-worker.js'
      - 'access-system/**'
      - 'Plain text/**'
      - 'scripts/build-static.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/verify-live-search-backend.mjs'
      - 'scripts/benchmark-production-endpoint.mjs'
      - 'scripts/verify-production-security.mjs'
      - '.github/workflows/deploy-cloudflare-worker.yml'
permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Defense in depth: production deployment is valid only for a push to main.
    # This prevents a manually selected feature/PR ref from deploying production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pre-deploy Worker security tests
        run: node scripts/verify-live-search-backend.mjs
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Verify production search quality
        run: node scripts/benchmark-production-endpoint.mjs
      - name: Verify production security controls
        run: node scripts/verify-production-security.mjs
