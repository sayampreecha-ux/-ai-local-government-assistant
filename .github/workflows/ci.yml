name: GovPrompt P0 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for deployed bytes to match this approved build
        shell: bash
        run: |
          mkdir -p artifacts/production-diagnosis
          for attempt in {1..30}; do
            if node scripts/verify-production-release-assets.mjs > artifacts/production-diagnosis/deployed-assets.json; then exit 0; fi
            if [ "$attempt" -lt 30 ]; then sleep 15; fi
          done
          exit 1
      - name: Verify actual Production UI and clipboard at 390px and 1365px
        env:
          GOVPROMPT_ACCEPTANCE_URL: https://sayampreecha-ux.github.io/-ai-local-government-assistant/
        run: node tests/e2e/production-diagnosis-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release-acceptance
          path: artifacts/production-diagnosis/
          if-no-files-found: warn
          retention-days: 7
  production-diagnosis-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify corrected branch UI, clipboard, privacy and 13 domains at 390px and 1365px
        run: node tests/e2e/production-diagnosis-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-diagnosis-acceptance
          path: artifacts/production-diagnosis/
          if-no-files-found: warn
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify prompt efficiency against base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
            # Baseline is the tested synthetic merge commit's pinned main parent.
            # Event base.sha can be older than the main included in HEAD.
            BASE_REF="$(git rev-parse HEAD^1)"
          elif [ "${{ github.ref }}" != "refs/heads/main" ] &&
               [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] &&
               [ "$(git rev-parse HEAD^1)" = "${{ github.event.before }}" ] &&
               git merge-base --is-ancestor HEAD^2 refs/remotes/origin/main; then
            # Feature-branch main sync: compare with its pinned main parent,
            # not the outdated feature head that predates accepted main changes.
            BASE_REF="$(git rev-parse HEAD^2)"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Keep feature pushes on the same pinned main lineage as PR checks.
            BASE_REF="$(git merge-base HEAD refs/remotes/origin/main)"
          else
            BASE_REF="${{ github.event.before }}"
            if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
              BASE_REF="HEAD^"
            fi
          fi
          git cat-file -e "$BASE_REF^{commit}"
          PROMPT_BASE_REF="$BASE_REF" node scripts/verify-prompt-efficiency.mjs | tee prompt-efficiency.log
      - name: Preserve prompt efficiency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-efficiency-evidence
          path: prompt-efficiency.log
          if-no-files-found: warn
          retention-days: 7
      - name: Run P0 verification tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee p0-test.log
      - name: Preserve P0 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-log
          path: p0-test.log
          if-no-files-found: warn
          retention-days: 3
      - run: pnpm build
      - name: Install Chromium for mobile browser verification
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Engineering six-action real browser handoff (18 cases, desktop/mobile)
        run: node tests/e2e/engineering-final.mjs
      - name: Preserve engineering final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-final-evidence
          path: artifacts/engineering-final/
          if-no-files-found: warn
      - name: Verify mobile workflow runtime and privacy boundary
        run: node scripts/verify-workflow-mobile-e2e.mjs
      - name: Verify FAT discipline and regression cases in real desktop and mobile UI
        run: FAT_UI_ROOT=dist node scripts/verify-fat-ui.mjs
      - name: GP001 PR-head browser acceptance (desktop and mobile)
        run: node tests/e2e/gp001-browser-acceptance.mjs
      - name: Document handoff and all-category release acceptance with no live AI
        run: |
          node scripts/verify-local-memo-browser.mjs
          node scripts/verify-document-handoff-browser.mjs
          node scripts/verify-pr346-release-browser.mjs
          node scripts/verify-pr346-docx.mjs
          node scripts/verify-pr346-studio-browser.mjs
      - name: Preserve document release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-release-evidence
          path: |
            artifacts/pr346-release/
            artifacts/pr347/
          if-no-files-found: error
      - name: Measure final copyable browser prompt for all GP domains
        run: node scripts/verify-prompt-efficiency-runtime.mjs
      - name: Compare browser-final prompt with pinned base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
            # Baseline is the tested synthetic merge commit's pinned main parent.
            # Event base.sha can be older than the main included in HEAD.
            BASE_REF="$(git rev-parse HEAD^1)"
          elif [ "${{ github.ref }}" != "refs/heads/main" ] &&
               [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] &&
               [ "$(git rev-parse HEAD^1)" = "${{ github.event.before }}" ] &&
               git merge-base --is-ancestor HEAD^2 refs/remotes/origin/main; then
            # Feature-branch main sync: compare with its pinned main parent,
            # not the outdated feature head that predates accepted main changes.
            BASE_REF="$(git rev-parse HEAD^2)"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Keep feature pushes on the same pinned main lineage as PR checks.
            BASE_REF="$(git merge-base HEAD refs/remotes/origin/main)"
          else
            BASE_REF="${{ github.event.before }}"
            git cat-file -e "$BASE_REF^{commit}" 2>/dev/null || BASE_REF="HEAD^"
          fi
          git worktree add --detach .prompt-base "$BASE_REF"
          ln -s ../node_modules .prompt-base/node_modules
          (cd .prompt-base && node scripts/build-static.mjs)
          PROMPT_RUNTIME_SOURCE_REF="$BASE_REF" PROMPT_RUNTIME_ROOT=.prompt-base/dist PROMPT_RUNTIME_REPORT=baseline.json node scripts/verify-prompt-efficiency-runtime.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('artifacts/prompt-efficiency-runtime/baseline.json'));
          const after = JSON.parse(readFileSync('artifacts/prompt-efficiency-runtime/results.json'));
          const old = new Map(before.rows.map(x => [x.scenario, x]));
          // Exact, reviewable improvements authorized for this PR; no wildcard or token budget.
          // Human approval of the PR remains required before merge/deployment.
          const reviewedChanges=[{"scenario":"GP001","before":"a244f6fb2565f7ec7627e20d33c7d3ce5093d959214610960bc116d00ca6bd97","after":"f0b4b79213dc07e707703d15b02115dcf9d3ea8585626cc0c31ff4ee43555dd1","deltaUtf8Bytes":1975,"reason":"User requested downstream completion with editable DOCX when available and full-text fallback for free/no-file-tool AI, document-only adapter rejects unsupported completed actions and separates officer checklist, all existing governance retained, 17 other runtime scenarios byte-identical. See docs/quality/pr346/prompt-comparison.json. Human merge approval still required."},{"scenario":"GP002","before":"6059631130361159d72752e963405f8fcfcfb4577fd3e144d9929a8b5c3101a3","after":"2b9659d68c48427a0538646774d30b79faf8c56a5d9f0a4243e827ce93aaec40","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP003","before":"c183c4eba7170aaf2120b276ecc040fc3bb1fe8d11e5e810afa5753ed1b8dee1","after":"8cc739c6f2a0fd2ebc5f4790f578bf7d3bada71572525122eb4bac206b25659c","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP004","before":"39db64f4c7a344cb8fff8a154109fa88856d092581d25239c035bf14428b2b70","after":"e721e6ec0d66690b34997496fc022079263cf0679195fa34770ac3f083842375","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP005","before":"46653ae90afe9720d2bf01e027380b8576e9b2af3bee82450f9b85c0773c3d85","after":"86a4b2a88e3d0a4ea9755578f6075a8a83e2985513bab14c306076f388365649","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP006","before":"9d458a0b704a278c2df58aa0fd46cb867685959730dd3fae3d60d0b624a1d0aa","after":"a17b5e1ba71575ac07fbed58f55a5a4f809bceb4721a37bc515fff1ac0eaefca","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP007","before":"f5fc2c6ec5fa9b68f568a9a4a855b7151112324075e5658b3d7c06c4d03ae473","after":"28f87f965e395b487c207ff46d935cfb2beba44cc04bcc7010796c8f5f0e6923","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP008","before":"90f2f7a04cfeb74d5a6dabb8faba3f2d5935d311dd67e8c10503921183bd34b3","after":"4646ad48d2f289e8976448422d9973065e9cbfe6584adeb54ebc5d5e1e469f6b","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP009","before":"8513b21188bd2b0685ac566706c9cee8bcf96fda8787c4ae7475f8c0566795d8","after":"bc48d1a51892a912cff062526116dbe41bf2c4ecd8ef0f08ba35fdb073fea504","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP010","before":"96ad629e63f765ab75a2c73f9d8cd76e0b82c3d84a4090d9c9259a5cff0922ee","after":"72059f089526ae35a91773e557d139f8f592bd580524531ab72482a8db950f09","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP011","before":"3ddd11dc3ca14744f0096d49db234a89368069cc09493e17ea3553161b70dae4","after":"86db0a30d198efd6abe8a5c22aa17b05a2b066acb74e3549b51591d6febff257","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"GP013","before":"720fd773ef673436d51ce9e40c9292fc9548ff64a5f978db2f7351fd939d5a76","after":"b58fe87be21069c855ae09411f2ebec050d7608a355da1e7709dfec66d116f34","deltaUtf8Bytes":-2188,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2 plus council agenda correction"},{"scenario":"HIGH-RISK-FINANCE","before":"d0f89ac39b0ea2c1a8367b42cb4e96b7027050b15967426582cf734ef5090c6d","after":"12c1f26b2d7281a988534dc687650e8dd27111ae073c61764f6fc8a11c85a546","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"HIGH-RISK-LEGAL","before":"ca0c654d75b50fbad2261cbebacfc4371209ae7b3a2dd340288dd043a8e9fa0a","after":"05f588279f6ed2048c0f0d5f7b09ddd89296472cf9e2eb1d234f05727e6b2ab4","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"HIGH-RISK-PROCUREMENT","before":"44a12c09dd01d5933d942eb79054b5faf20e7189b915b37df15ba6a60a5c61fc","after":"99830c9886ded6b42c7d127717f1cd242db93f5ec771d4f75edeb6b20847f3aa","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"},{"scenario":"RUNTIME-REVENUE","before":"30b571010e1d31620d4fdb5ccce2238420133784a58796fc2927794c39bb04a5","after":"d37b100adb4effddd83249ed1eaec4c6177b43e2a05d9095f23d70c4f47b5461","deltaUtf8Bytes":-878,"reason":"Retain all core and domain instructions and omit only four covered common appendix rules from accepted 040404d2"}];
          const isReviewedChange=row => reviewedChanges.some(x=>x.scenario===row.scenario && x.before===row.before.sha256 && x.after===row.after.sha256 && x.deltaUtf8Bytes===row.deltaUtf8Bytes);
          const rows = after.rows.map(item => {
            const base = old.get(item.scenario);
            if (!base || base.status !== 'PASS' || item.status !== 'PASS') throw Error('Missing successful baseline: '+item.scenario);
            return { scenario:item.scenario, before:{chars:base.chars,utf8Bytes:base.utf8Bytes,estimatedTokens:base.tokenEstimate,sha256:base.sha256},
              after:{chars:item.chars,utf8Bytes:item.utf8Bytes,estimatedTokens:item.tokenEstimate,sha256:item.sha256},
              deltaChars:item.chars-base.chars,deltaUtf8Bytes:item.utf8Bytes-base.utf8Bytes,
              deltaEstimatedTokens:item.tokenEstimate-base.tokenEstimate,
              sha256Equal:base.sha256===item.sha256 };
          });
          for (const row of rows) row.reviewedChange=reviewedChanges.find(x=>isReviewedChange(row) && x.scenario===row.scenario)?.reason || null;
          const result={baseRef:before.head,headRef:after.head,requiresHumanMergeReview:true,note:'Estimated tokens = ceil(UTF8 bytes/4), not model tokens',rows};
          writeFileSync('artifacts/prompt-efficiency-runtime/comparison.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          // All unchanged scenarios retain exact-copy and zero-growth contracts.
          // Only the exact, tested semantic improvements above may differ.
          const changed=rows.filter(x=>!x.before.sha256||!x.after.sha256||(!x.sha256Equal&&!isReviewedChange(x)));
          if(changed.length){console.error('Browser-final prompt SHA-256 mismatch:',changed.map(x=>x.scenario));process.exitCode=1;}
          const growth=rows.filter(x=>x.deltaUtf8Bytes>0&&!isReviewedChange(x));
          if(growth.length){console.error('Browser-final prompt growth requires human review and verified exception:',growth.map(x=>x.scenario));process.exitCode=1;}
          NODE
      - name: Preserve final runtime prompt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-efficiency-final-runtime
          path: artifacts/prompt-efficiency-runtime/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve GP001 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp001-browser-evidence
          path: artifacts/gp001-browser-e2e/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve FAT UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fat-ui-evidence
          path: artifacts/fat-ui/
          if-no-files-found: warn
