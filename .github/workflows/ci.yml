name: GovPrompt P0 verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run P0 verification tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee p0-test.log
      - name: Preserve P0 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-log
          path: p0-test.log
          if-no-files-found: warn
          retention-days: 3
      - run: pnpm build
