name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production Pages may only publish the main branch, including manual fallback runs.
    # Run on every main push so GitHub's branch-based Pages build can never remain the last deployment
    # after a scripts/workflow-only change. This workflow always publishes the security-gated dist artifact.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security invariant release gate
        run: node scripts/verify-security-invariants.mjs
      - name: Public Beta privacy/security regression gate
        run: node scripts/verify-internal-pilot-security.mjs
      - run: pnpm test
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy approved static artifact
        id: deployment
        uses: actions/deploy-pages@v4
