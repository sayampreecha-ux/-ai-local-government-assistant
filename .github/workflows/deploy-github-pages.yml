name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.htlm'
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.webmanifest'
      - '*.txt'
      - '*.xml'
      - 'assets/**'
      - 'access-system/**'
      - 'Plain text/**'
      - 'knowledge/**'
      - 'src/**'
      - 'scripts/build-static.mjs'
      - 'scripts/verify-security-invariants.mjs'
      - 'scripts/verify-internal-pilot-security.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production Pages may only publish the main branch, including manual fallback runs.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security invariant release gate
        run: node scripts/verify-security-invariants.mjs
      - name: Public Beta privacy/security regression gate
        run: node scripts/verify-internal-pilot-security.mjs
      - run: pnpm test
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy approved static artifact
        id: deployment
        uses: actions/deploy-pages@v4
