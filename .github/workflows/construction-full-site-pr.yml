name: Construction Full-Site PR Acceptance
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'tests/e2e/construction-full-site-pr.mjs'
      - '.github/workflows/construction-full-site-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-site-pr:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 321
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start full site local HTTP server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/govprompt-http.log 2>&1 &
          echo $! > /tmp/govprompt-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/govprompt-http.log
          exit 1
      - name: Full-site desktop/mobile acceptance from PR HEAD
        run: node tests/e2e/construction-full-site-pr.mjs
      - name: Run 500-case regression
        if: always()
        run: node scripts/verify-real-case-quality-500.mjs
      - name: Run scoped engineering regression
        if: always()
        run: node scripts/verify-pilot-quality-30.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-full-site-pr-evidence
          path: |
            artifacts/construction-full-site-pr/
            /tmp/govprompt-http.log
          retention-days: 30
