name: Materialize production assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '.github/workflows/materialize-dist.yml'
  workflow_dispatch:

permissions:
  # The generated dist is committed so Cloudflare Workers Builds can deploy the assets binding without a dashboard build command.
  contents: write

concurrency:
  group: materialize-production-assets
  cancel-in-progress: false

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit generated production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist is already current"
            exit 0
          fi
          git commit -m "build: materialize production dist [skip ci]"
          git push origin HEAD:main
