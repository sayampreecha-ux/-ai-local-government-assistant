name: Verify Core Production Proof

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'assets/js/home-v3.js'
      - 'assets/js/core/privacy-guard.js'
      - 'assets/js/core/privacy-submit-guard.js'
      - 'assets/js/core/government-workflow-runtime-v5.js'
      - 'assets/js/ui/case-list-ui-v1.js'
      - 'src/government-case-memory-v1.js'
      - 'src/citizen-service-workflow.js'
      - 'src/government-workflow-*.js'
      - 'src/government-task-router-v5.js'
      - 'scripts/verify-frontend-production.mjs'
      - 'scripts/verify-issue73-production-e2e.mjs'
      - 'scripts/verify-three-workflows-production-e2e.mjs'
      - '.github/workflows/verify-core-production-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: core-production-proof
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for GitHub Pages propagation
        run: sleep 60
      - name: Verify GitHub Pages production surface
        run: node scripts/verify-frontend-production.mjs
      - name: Install Chromium for real-browser production E2E
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify privacy boundary in real browser
        run: node scripts/verify-issue73-production-e2e.mjs
      - name: Verify three priority government workflows in real browser
        run: node scripts/verify-three-workflows-production-e2e.mjs
      - name: Publish Core Production PASS proof
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Core Production PASS Proof';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const productionUrl = 'https://sayampreecha-ux.github.io/-ai-local-government-assistant/index.html';
            const body = [
              '# ✅ Core Production PASS',
              '',
              `- Verified commit: \`${context.sha}\``,
              `- Verified at: ${new Date().toISOString()}`,
              `- Production: ${productionUrl}`,
              `- Workflow run: ${runUrl}`,
              '',
              '## Core production checks',
              '- GitHub Pages production surface: PASS',
              '- Privacy/PII boundary in real browser: PASS',
              '- ซื้อเครื่องจักร 100 ล้านบาท: PASS',
              '- แผนอัตรากำลัง อบต.: PASS',
              '- ขออนุญาตก่อสร้างบ้าน / Citizen Service: PASS',
              '- Case Memory resume / งานค้าง: PASS',
              '- Privacy-minimized Case Memory: PASS',
              '- Browser page errors: PASS',
              '',
              '## Scope note',
              '- This proof covers the GovPrompt core workflow/runtime/UI/privacy path on production.',
              '- Official Search / Tavily and Budget evidence integration remain independently gated and are tracked separately in Issue #124.',
              '- No fail-closed, evidence, privacy, or human-approval gate is bypassed by this scoped proof.',
              '',
              '> This issue is written only after every core production verification step above succeeds.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
