name: Circular Watch branch acceptance
on:
  pull_request:
    paths:
      - 'circular-watch.html'
      - 'assets/js/core/circular-watch-registry.js'
      - 'assets/js/ui/circular-watch-ui.js'
      - 'knowledge/circulars/**'
      - 'tests/unit/circular-watch-registry.test.js'
      - 'tests/unit/circular-watch-import.test.js'
      - 'scripts/circular-watch-import.mjs'
      - 'scripts/circular-watch-source-gate.mjs'
      - 'scripts/circular-watch-review-gate.mjs'
      - 'tests/unit/circular-watch-source-gate.test.js'
      - 'tests/unit/circular-watch-review-gate.test.js'
      - 'tests/unit/circular-watch-no-review-publish.test.js'
      - 'scripts/benchmark-circular-watch.mjs'
      - 'tests/e2e/circular-watch-browser.mjs'
      - '.github/workflows/circular-watch-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  circular-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record immutable tested source
        run: |
          mkdir -p artifacts/circular-watch
          git rev-parse HEAD > artifacts/circular-watch/tested-head.txt
      - name: Registry unit tests
        run: |
          set -o pipefail
          node --test tests/unit/circular-watch*.test.js | tee artifacts/circular-watch/unit.log
      - name: Validate official discovery sources
        run: node scripts/circular-watch-source-gate.mjs
      - name: Benchmark 50k synthetic records
        run: node scripts/benchmark-circular-watch.mjs
      - name: Build static site
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Mobile and desktop browser E2E
        env:
          CIRCULAR_WATCH_SITE_ROOT: dist
        run: |
          set -o pipefail
          node tests/e2e/circular-watch-browser.mjs | tee artifacts/circular-watch/browser.log
      - name: Preserve branch acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circular-watch-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/circular-watch/
