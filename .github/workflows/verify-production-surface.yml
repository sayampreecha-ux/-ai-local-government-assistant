name: Verify Production Surface

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'trust.html'
      - 'assets/js/home-v3.js'
      - 'assets/js/core/privacy-guard.js'
      - 'src/search-worker.js'
      - 'scripts/verify-frontend-production.mjs'
      - 'scripts/verify-production-security.mjs'
      - '.github/workflows/verify-production-surface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-surface-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for deployment propagation
        run: sleep 45
      - name: Verify GitHub Pages production surface
        run: node scripts/verify-frontend-production.mjs
      - name: Verify Cloudflare Worker production security
        run: node scripts/verify-production-security.mjs
