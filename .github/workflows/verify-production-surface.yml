name: Verify Production Surface

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'trust.html'
      - 'privacy-notice.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'admin.html'
      - 'service-worker.js'
      - 'assets/js/home-v3.js'
      - 'assets/js/core/privacy-guard.js'
      - 'assets/js/core/privacy-submit-guard.js'
      - 'assets/js/core/media-routing-overrides.js'
      - 'assets/js/core/budget-*.js'
      - 'assets/js/core/official-source-registry.js'
      - 'src/search-worker.js'
      - 'src/search-worker-v2.js'
      - 'src/budget-*.js'
      - 'scripts/build-static.mjs'
      - 'scripts/verify-frontend-production.mjs'
      - 'scripts/verify-production-security.mjs'
      - 'scripts/verify-issue73-production-e2e.mjs'
      - 'scripts/verify-budget-production-e2e.mjs'
      - '.github/workflows/verify-production-surface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-surface-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for deployment propagation
        run: sleep 60
      - name: Verify GitHub Pages production surface
        run: node scripts/verify-frontend-production.mjs
      - name: Verify Cloudflare Worker production security
        run: node scripts/verify-production-security.mjs
      - name: Install Chromium for production E2E
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Issue 73 privacy boundary in real browser
        run: node scripts/verify-issue73-production-e2e.mjs
      - name: Verify Budget Draft Agent short-command workflow in real browser
        run: node scripts/verify-budget-production-e2e.mjs
