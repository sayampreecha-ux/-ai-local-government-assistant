name: Verify Production Surface

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gp008.html'
      - 'maintenance-fund-plan.html'
      - 'trust.html'
      - 'privacy-notice.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'admin.html'
      - 'service-worker.js'
      - 'assets/js/home-v3.js'
      - 'assets/js/mic.js'
      - 'assets/js/ui/assistant-catalog-accordion-v1.js'
      - 'assets/js/core/context-integration.js'
      - 'assets/js/core/privacy-guard.js'
      - 'assets/js/core/privacy-submit-guard.js'
      - 'assets/js/core/media-routing-overrides.js'
      - 'assets/js/core/budget-*.js'
      - 'assets/js/core/official-source-registry.js'
      - 'assets/js/core/government-workflow-runtime-v5.js'
      - 'assets/js/ui/case-list-ui-v1.js'
      - 'src/government-case-memory-v1.js'
      - 'src/citizen-service-workflow.js'
      - 'src/government-workflow-*.js'
      - 'src/government-task-router-v5.js'
      - 'assets/js/features/public-health-worker-toolkit-v1.js'
      - 'assets/js/features/temp-staff-maintenance-fund-v1.js'
      - 'assets/js/features/temp-staff-guided-workflow-v2.js'
      - 'assets/js/features/maintenance-fund-plan-v1.js'
      - 'assets/js/features/mosquito-public-health-placement-v1.js'
      - 'assets/js/features/mosquito-survey-onepage-v1.js'
      - 'src/search-worker.js'
      - 'src/search-worker-v2.js'
      - 'src/budget-*.js'
      - 'scripts/build-static.mjs'
      - 'scripts/verify-frontend-production.mjs'
      - 'scripts/verify-thai-workflow-ui-production-e2e.mjs'
      - 'scripts/verify-gp008-production.mjs'
      - 'scripts/verify-public-health-home-production-e2e.mjs'
      - 'scripts/verify-maintenance-fund-production-e2e.mjs'
      - 'scripts/verify-production-security.mjs'
      - 'scripts/verify-issue73-production-e2e.mjs'
      - 'scripts/verify-budget-production-e2e.mjs'
      - 'scripts/verify-three-workflows-production-e2e.mjs'
      - '.github/workflows/deploy-github-pages.yml'
      - '.github/workflows/verify-production-surface.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-surface-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for approved GitHub Pages artifact
        run: |
          for attempt in {1..12}; do
            echo "Production sync check ${attempt}/12"
            if node scripts/verify-frontend-production.mjs; then
              echo "Approved dist artifact is live."
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done
          echo "Production did not converge to the approved dist artifact in time."
          exit 1
      - name: Verify GP008 health worker toolkit on production
        run: node scripts/verify-gp008-production.mjs
      - name: Verify Cloudflare Worker production security
        run: node scripts/verify-production-security.mjs
      - name: Install Chromium for production E2E
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public-health Home shortcut in real browser
        run: node scripts/verify-public-health-home-production-e2e.mjs
      - name: Verify maintenance-fund plan workflow in real browser
        run: node scripts/verify-maintenance-fund-production-e2e.mjs
      - name: Verify Issue 73 privacy boundary in real browser
        run: node scripts/verify-issue73-production-e2e.mjs
      - name: Verify Budget Draft Agent short-command workflow in real browser
        run: node scripts/verify-budget-production-e2e.mjs
      - name: Verify three priority government workflows in real browser
        run: node scripts/verify-three-workflows-production-e2e.mjs
      - name: Publish Production PASS proof
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production PASS Proof';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const productionUrl = 'https://sayampreecha-ux.github.io/-ai-local-government-assistant/index.html';
            const body = [
              '# ✅ Production PASS',
              '',
              `- Verified commit: \`${context.sha}\``,
              `- Verified at: ${new Date().toISOString()}`,
              `- Production: ${productionUrl}`,
              `- Workflow run: ${runUrl}`,
              '',
              '## Production checks',
              '- GitHub Pages production surface: PASS',
              '- GP008 production surface: PASS',
              '- Public Health Home shortcut real-browser check: PASS',
              '- Maintenance-fund plan real-browser E2E: PASS',
              '- Cloudflare Worker production security: PASS',
              '- Issue #73 privacy boundary in real browser: PASS',
              '- Budget Draft Agent real-browser E2E: PASS',
              '- ซื้อเครื่องจักร 100 ล้านบาท: PASS',
              '- แผนอัตรากำลัง อบต.: PASS',
              '- ขออนุญาตก่อสร้างบ้าน / Citizen Service: PASS',
              '- Case Memory resume / งานค้าง: PASS',
              '- Privacy-minimized Case Memory: PASS',
              '',
              '> This issue is written only after every production verification step above succeeds.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open'
              });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }