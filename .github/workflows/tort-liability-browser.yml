name: Tort Level-1 Browser Acceptance
on:
  push:
    branches:
      - docs/tort-liability-evidence-register-20261026
  pull_request:
    paths:
      - 'assets/js/home-v3.js'
      - 'assets/js/core/output-router.js'
      - 'assets/js/core/official-search-connector.js'
      - 'test/work-catalog-home.test.mjs'
      - 'scripts/verify-tort-browser-level1.mjs'
  workflow_dispatch:
jobs:
  tort-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start static branch UI
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tort-server.log 2>&1 &
      - name: Verify mobile and desktop tort result prompt
        run: node scripts/verify-tort-browser-level1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tort-browser-screenshots
          path: artifacts/tort-browser/
          if-no-files-found: warn
