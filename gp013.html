<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยงานสภาท้องถิ่น | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 70px}h1{font-size:25px}.search,input,textarea,select{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:96px}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>🏛️ ผู้ช่วยงานสภาท้องถิ่น</h1><input class="search" id="filter" placeholder="ค้นหา เช่น ญัตติ องค์ประชุม มติสภา ข้อบัญญัติ"><section class="list"><button class="task" data-task="จัดทำญัตติเสนอสภาท้องถิ่น">📝 จัดทำญัตติ</button><button class="task" data-task="ตรวจญัตติและเอกสารประกอบ">✅ ตรวจญัตติ</button><button class="task" data-task="วิเคราะห์และจัดทำการกำหนดสมัยประชุมสามัญหรือการเรียกประชุมวิสามัญ">🗓️ สมัยประชุม</button><button class="task" data-task="จัดทำระเบียบวาระการประชุมสภา">📋 ระเบียบวาระ</button><button class="task" data-task="ร่างหนังสือเชิญประชุมสภา">✉️ เชิญประชุม</button><button class="task" data-task="จัดทำรายงานการประชุมสภาท้องถิ่น">📄 รายงานประชุม</button><button class="task" data-task="ตรวจองค์ประชุม การลงมติ และผลประโยชน์ทับซ้อน">🗳️ องค์ประชุม/ลงมติ</button><button class="task" data-task="วิเคราะห์กระทู้ถามและคำชี้แจงต่อสภา">❓ กระทู้ถาม</button><button class="task" data-task="ตรวจขั้นตอนข้อบัญญัติท้องถิ่น">📚 ข้อบัญญัติ</button><button class="task" data-task="ตรวจขั้นตอนการพิจารณาข้อบัญญัติงบประมาณในสภา">💰 พิจารณางบในสภา</button><button class="task" data-task="วิเคราะห์การตั้งคณะกรรมการสภาและแปรญัตติ">👥 คณะกรรมการ/แปรญัตติ</button><button class="task" data-task="ตรวจกรอบเวลาและความชอบด้วยกฎหมายของการประชุมสภา">⏱️ ตรวจขั้นตอน/กรอบเวลา</button><button class="task" data-task="จัดทำสรุปมติและข้อสั่งการจากสภา">📌 สรุปมติสภา</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="grid"><div><label>ประเภทองค์กรปกครองส่วนท้องถิ่น</label><input id="agency"></div><div><label>ประเภท/สมัยประชุม</label><input id="meeting"></div><div class="full"><label>เรื่องหรือชื่อญัตติ</label><input id="subject"></div><div class="full"><label>ข้อเท็จจริงและลำดับเหตุการณ์</label><textarea id="facts"></textarea></div><div class="full"><label>ระเบียบวาระหรือข้อเสนอ</label><textarea id="agenda"></textarea></div><div class="full"><label>สมาชิก ผู้เข้าประชุม และองค์ประชุม</label><textarea id="members"></textarea></div><div class="full"><label>กฎหมาย ระเบียบ ข้อบังคับ หรือเอกสารที่มี</label><textarea id="law"></textarea></div><div><label>กำหนดวัน/กรอบเวลา</label><input id="deadline"></div><div><label>ผลลัพธ์ที่ต้องการ</label><input id="goal"></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">โปรดปกปิดข้อมูลส่วนบุคคลที่ไม่จำเป็น และแนบเอกสารประชุมหรือร่างข้อบัญญัติใน ChatGPT เพื่อให้ตรวจจากต้นฉบับ</div></section></main><script>let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญกฎหมายและงานสภาท้องถิ่นไทย\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- ประเภทองค์กรปกครองส่วนท้องถิ่น: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- ประเภท/สมัยประชุม: ${val('meeting')||'[ยังไม่ได้ระบุ]'}\n- เรื่องหรือชื่อญัตติ: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริงและลำดับเหตุการณ์: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- ระเบียบวาระหรือข้อเสนอ: ${val('agenda')||'[ยังไม่ได้ระบุ]'}\n- สมาชิก ผู้เข้าประชุม และองค์ประชุม: ${val('members')||'[ยังไม่ได้ระบุ]'}\n- กฎหมาย ระเบียบ ข้อบังคับ หรือเอกสารที่มี: ${val('law')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- กำหนดวัน/กรอบเวลา: ${val('deadline')||'[ยังไม่ได้ระบุ]'}\n- ผลลัพธ์ที่ต้องการ: ${val('goal')||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- แยกข้อเท็จจริง ข้อมูลที่ขาด ประเด็นกฎหมาย ฐานอำนาจ ขั้นตอน กรอบเวลา การวิเคราะห์ ความเสี่ยง และข้อเสนอแนะ\n- ตรวจการเรียกประชุม ระเบียบวาระ องค์ประชุม ผู้มีส่วนได้เสีย การอภิปราย การลงมติ การบันทึกมติ และการส่งเรื่องให้ผู้มีอำนาจ\n- แยกบทบาทประธานสภา สมาชิกสภา ผู้บริหารท้องถิ่น เลขานุการสภา คณะกรรมการสภา และผู้กำกับดูแลตามกรณี\n- ห้ามสมมติชื่อบุคคล จำนวนสมาชิก วันประชุม คะแนนเสียง เลขข้อ เลขหนังสือ หรือข้อเท็จจริงที่ไม่ได้ให้\n- ตรวจ PDPA และระบุเอกสารที่ต้องแนบหรือตรวจต้นฉบับก่อนนำไปใช้จริง\n- อ้างเฉพาะกฎหมาย ระเบียบ หรือแหล่งทางการที่ตรวจสอบได้`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/prompt-registry.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/core/context-integration.js"></script><script src="assets/js/core/document-loader.js"></script><script src="assets/js/core/citation-engine.js"></script><script src="assets/js/core/knowledge-index.js"></script><script src="assets/js/core/semantic-search.js"></script><script src="assets/js/core/knowledge-engine.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
