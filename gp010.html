<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยตรวจสอบภายใน | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5ebf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 40px}h1{font-size:25px}.search,input,textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}.field{position:relative}.mic{position:absolute;right:7px;top:34px;border:0;background:#edf2f7;border-radius:8px;padding:7px;cursor:pointer}.mic.listening{background:#d7263d;color:#fff}.field input,.field textarea{padding-right:46px}.field textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>🔍 ผู้ช่วยตรวจสอบภายใน</h1><input class="search" id="filter" placeholder="ค้นหา เช่น แผนตรวจสอบ ความเสี่ยง พัสดุ ก่อสร้าง"><section class="list" id="tasks"><button class="task" data-task="แผนตรวจสอบประจำปี">📋 แผนตรวจสอบประจำปี</button><button class="task" data-task="ประเมินความเสี่ยง">⚠️ ประเมินความเสี่ยง</button><button class="task" data-task="แผนตรวจสอบตามความเสี่ยง">📊 Risk-Based Audit</button><button class="task" data-task="ตรวจการเงินและการคลัง">💰 ตรวจการเงินและการคลัง</button><button class="task" data-task="ตรวจพัสดุและจัดซื้อจัดจ้าง">📦 ตรวจพัสดุและจัดซื้อจัดจ้าง</button><button class="task" data-task="ตรวจโครงการก่อสร้าง">🏗️ ตรวจโครงการก่อสร้าง</button><button class="task" data-task="ตรวจทรัพย์สิน">🏢 ตรวจทรัพย์สิน</button><button class="task" data-task="ตรวจการควบคุมภายใน">🛡️ ตรวจการควบคุมภายใน</button><button class="task" data-task="ตรวจการปฏิบัติตามกฎหมายและระเบียบ">⚖️ Compliance Audit</button><button class="task" data-task="วิเคราะห์ข้อบกพร่อง">🧩 วิเคราะห์ข้อบกพร่อง</button><button class="task" data-task="รายงานผลการตรวจสอบ">📄 รายงานผลการตรวจสอบ</button><button class="task" data-task="ติดตามผลการแก้ไข">✅ ติดตามผลการแก้ไข</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="grid"><div class="field"><label>หน่วยงาน</label><input id="agency"><button class="mic" data-target="agency">🎤</button></div><div class="field"><label>ประเภทการตรวจ</label><input id="auditType"><button class="mic" data-target="auditType">🎤</button></div><div class="field full"><label>เรื่องที่ตรวจ</label><input id="subject"><button class="mic" data-target="subject">🎤</button></div><div class="field full"><label>ข้อเท็จจริง</label><textarea id="facts"></textarea><button class="mic" data-target="facts">🎤</button></div><div class="field full"><label>เอกสาร/หลักฐานที่มี</label><textarea id="evidence"></textarea><button class="mic" data-target="evidence">🎤</button></div><div class="field full"><label>ประเด็นความเสี่ยง</label><textarea id="risk"></textarea><button class="mic" data-target="risk">🎤</button></div><div class="field full"><label>กฎหมาย/ระเบียบที่เกี่ยวข้อง</label><textarea id="law"></textarea><button class="mic" data-target="law">🎤</button></div><div class="field full"><label>ข้อสังเกต</label><textarea id="finding"></textarea><button class="mic" data-target="finding">🎤</button></div><div class="field full"><label>ข้อเสนอแนะ</label><textarea id="recommendation"></textarea><button class="mic" data-target="recommendation">🎤</button></div><div class="field full"><label>ผลลัพธ์ที่ต้องการ</label><textarea id="result"></textarea><button class="mic" data-target="result">🎤</button></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">กรุณาตรวจสอบหลักฐาน ระเบียบล่าสุด และหลีกเลี่ยงข้อมูลส่วนบุคคลที่ไม่จำเป็นก่อนนำไปใช้จริง</div></section></main><script>let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');document.querySelectorAll('.mic').forEach(btn=>btn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('ไมโครโฟนรองรับดีที่สุดบน Chrome หรือ Edge');const target=$(btn.dataset.target),r=new SR();r.lang='th-TH';btn.classList.add('listening');r.onresult=e=>{target.value+=(target.value?' ':'')+e.results[0][0].transcript};r.onend=()=>btn.classList.remove('listening');r.onerror=()=>btn.classList.remove('listening');r.start()});$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานตรวจสอบภายในภาครัฐและองค์กรปกครองส่วนท้องถิ่น\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- ประเภทการตรวจ: ${val('auditType')||'[ยังไม่ได้ระบุ]'}\n- เรื่องที่ตรวจ: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- เอกสาร/หลักฐานที่มี: ${val('evidence')||'[ยังไม่ได้ระบุ]'}\n- ประเด็นความเสี่ยง: ${val('risk')||'[ยังไม่ได้ระบุ]'}\n- กฎหมาย/ระเบียบที่เกี่ยวข้อง: ${val('law')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- ข้อสังเกต: ${val('finding')||'[ยังไม่ได้ระบุ]'}\n- ข้อเสนอแนะ: ${val('recommendation')||'[ยังไม่ได้ระบุ]'}\n- ผลลัพธ์ที่ต้องการ: ${val('result')||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- แยกข้อเท็จจริง เกณฑ์ตรวจสอบ ผลการตรวจ ข้อบกพร่อง ความเสี่ยง และข้อเสนอแนะ\n- ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน หรือข้อกฎหมาย\n- หากข้อมูลไม่ครบให้ระบุ [ต้องตรวจสอบ/เพิ่มเติม]\n- คำนึงถึง PDPA ความลับทางราชการ และความเป็นอิสระของผู้ตรวจสอบ\n- ผู้ใช้ต้องตรวจทานเอกสารและกฎหมายฉบับจริงก่อนใช้`; $('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/prompt-registry.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/core/context-integration.js"></script><script src="assets/js/core/document-loader.js"></script><script src="assets/js/core/citation-engine.js"></script><script src="assets/js/core/knowledge-index.js"></script><script src="assets/js/core/knowledge-engine.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
