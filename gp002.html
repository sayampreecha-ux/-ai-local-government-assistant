<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยกฎหมาย | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px}h1{font-size:25px}.list,.grid,.io{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task,.io label,.io button{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}input,textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit}textarea{min-height:100px}.io{margin:12px 0}.io label,.io button{cursor:pointer;font-weight:700}.io input{display:none}.files{font-size:12px;color:#566b84}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid,.io{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>⚖️ ผู้ช่วยกฎหมาย</h1><section class="list"><button class="task" data-task="วิเคราะห์ข้อกฎหมาย">วิเคราะห์ข้อกฎหมาย</button><button class="task" data-task="วิเคราะห์อำนาจหน้าที่">วิเคราะห์อำนาจหน้าที่</button><button class="task" data-task="วิเคราะห์ระเบียบและหนังสือสั่งการ">วิเคราะห์ระเบียบ/หนังสือสั่งการ</button><button class="task" data-task="ร่างหนังสือหารือ">ร่างหนังสือหารือ</button><button class="task" data-task="ตอบข้อหารือ">ตอบข้อหารือ</button><button class="task" data-task="วิเคราะห์ความเสี่ยงทางกฎหมาย">วิเคราะห์ความเสี่ยง</button><button class="task" data-task="ตรวจ PDPA">ตรวจ PDPA</button><button class="task" data-task="ตรวจฐานอำนาจและขั้นตอน">ตรวจฐานอำนาจ/ขั้นตอน</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="io"><label>📎 แนบเอกสาร<input id="files" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,image/*"></label><label>📷 ถ่ายรูป<input id="camera" type="file" accept="image/*" capture="environment"></label><button id="voice">🎤 พูดข้อมูล</button></div><div class="files" id="fileList">ยังไม่ได้เลือกไฟล์</div><div class="grid"><div><label>ประเภทหน่วยงาน</label><input id="agency" placeholder="เช่น อบจ. เทศบาล อบต."></div><div><label>เรื่อง</label><input id="subject"></div><div class="full"><label>ข้อเท็จจริง</label><textarea id="facts"></textarea></div><div class="full"><label>ข้อหารือหรือคำถาม</label><textarea id="question"></textarea></div><div class="full"><label>กฎหมาย/เอกสารอ้างอิงที่มี</label><textarea id="law"></textarea></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" onclick="location.reload()">ล้าง</button></div><div class="output" id="output"></div><div class="note">หลังคัดลอก Prompt ให้แนบไฟล์เดียวกันใน ChatGPT/Gemini และตรวจฉบับกฎหมายล่าสุดก่อนใช้จริง</div></section></main><script>let task='',names=[];const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});function add(fs){names=[...new Set(names.concat([...fs].map(f=>f.name)))];$('fileList').textContent=names.length?'ไฟล์ที่เลือก: '+names.join(', '):'ยังไม่ได้เลือกไฟล์'}$('files').onchange=e=>add(e.target.files);$('camera').onchange=e=>add(e.target.files);$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('อุปกรณ์นี้ยังไม่รองรับการพูด');const r=new SR();r.lang='th-TH';r.onresult=e=>{$('facts').value+=($('facts').value?'\n':'')+e.results[0][0].transcript};r.start()};$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญกฎหมายราชการไทยและกฎหมายท้องถิ่น\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- ประเภทหน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- ข้อหารือ/คำถาม: ${val('question')||'[ยังไม่ได้ระบุ]'}\n- กฎหมาย/เอกสารอ้างอิง: ${val('law')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- เอกสารที่จะอัปโหลดเพิ่ม: ${names.length?names.join(', '):'[ไม่มี]'}\n\nข้อกำหนด\n- ใช้ข้อเท็จจริงและเอกสารแนบเป็นหลัก ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน มาตรา หรือคำพิพากษา\n- แยกข้อเท็จจริง ข้อมูลที่ขาด ประเด็นกฎหมาย ฐานอำนาจ เงื่อนไข ขั้นตอน การวิเคราะห์ ความเสี่ยง ทางเลือก และข้อเสนอที่ปลอดภัย\n- ตรวจ PDPA และระบุสิ่งที่ต้องตรวจสอบเพิ่มเติมก่อนนำไปใช้จริง`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};</script></body></html>
