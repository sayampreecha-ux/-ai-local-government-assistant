<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b75"><title>ผู้ช่วยการเงินและการคลัง | GovPrompt Thailand</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4eaf2;z-index:20}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 50px}h1{font-size:25px}.search,input,textarea,select{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:96px}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:9px 0 5px}.field{position:relative}.mic{position:absolute;right:7px;bottom:7px;border:0;border-radius:8px;background:#edf2f7;padding:7px;cursor:pointer}.mic.on{background:#fee2e2;color:#b91c1c}.field input,.field textarea{padding-right:48px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}.wrap{padding-bottom:30px}}</style><link rel="stylesheet" href="assets/css/govprompt.css"></head><body><header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header><main class="wrap"><h1>💰 ผู้ช่วยการเงินและการคลัง</h1><input class="search" id="filter" placeholder="ค้นหา เช่น ค่าเดินทาง ค่าเช่าบ้าน ฎีกา เงินสะสม"><section class="list" id="tasks"><button class="task" data-task="วิเคราะห์และร่างเรื่องค่าใช้จ่ายเดินทางไปราชการ">🚗 ค่าเดินทางไปราชการ</button><button class="task" data-task="วิเคราะห์สิทธิและร่างเรื่องค่าเช่าบ้าน">🏠 ค่าเช่าบ้าน</button><button class="task" data-task="ตรวจความครบถ้วนฎีกาและเอกสารเบิกจ่าย">📄 ตรวจฎีกา/เบิกจ่าย</button><button class="task" data-task="วิเคราะห์เงินยืมราชการและการส่งใช้เงินยืม">💳 เงินยืมราชการ</button><button class="task" data-task="วิเคราะห์การใช้จ่ายเงินสะสม">🏦 เงินสะสม</button><button class="task" data-task="วิเคราะห์เงินอุดหนุนและเงื่อนไขการเบิกจ่าย">🤝 เงินอุดหนุน</button><button class="task" data-task="วิเคราะห์ค่าตอบแทน ค่าใช้สอย และสิทธิการเบิก">💵 ค่าตอบแทน/ค่าใช้สอย</button><button class="task" data-task="วิเคราะห์ความถูกต้องทางการเงินและความเสี่ยงก่อนอนุมัติ">✅ ตรวจการเงินก่อนอนุมัติ</button></section><section class="generator"><strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong><div class="grid"><div class="field"><label>หน่วยงาน</label><input id="agency"><button class="mic" data-target="agency">🎤</button></div><div class="field"><label>ปีงบประมาณ</label><input id="year"><button class="mic" data-target="year">🎤</button></div><div class="full field"><label>เรื่อง</label><input id="subject"><button class="mic" data-target="subject">🎤</button></div><div class="full field"><label>ข้อเท็จจริง</label><textarea id="facts"></textarea><button class="mic" data-target="facts">🎤</button></div><div class="full field"><label>จำนวนเงิน/วงเงิน</label><input id="amount"><button class="mic" data-target="amount">🎤</button></div><div class="full field"><label>วัตถุประสงค์และความจำเป็น</label><textarea id="purpose"></textarea><button class="mic" data-target="purpose">🎤</button></div><div class="full field"><label>ระเบียบ/หนังสือสั่งการที่มี</label><textarea id="rules"></textarea><button class="mic" data-target="rules">🎤</button></div><div class="full field"><label>คำถามหรือจุดที่กังวล</label><textarea id="question"></textarea><button class="mic" data-target="question">🎤</button></div></div><div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div><div class="output" id="output"></div><div class="note">ตรวจสิทธิ ฐานอำนาจ เอกสารประกอบ ขั้นตอนอนุมัติ PDPA และข้อมูลสำคัญที่ยังขาดก่อนนำไปใช้จริง</div></section></main><script>let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');document.querySelectorAll('.mic').forEach(btn=>btn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('ฟังก์ชันพูดรองรับดีที่สุดบน Chrome หรือ Edge');const target=$(btn.dataset.target),r=new SR();r.lang='th-TH';r.onstart=()=>btn.classList.add('on');r.onend=()=>btn.classList.remove('on');r.onresult=e=>{const t=e.results[0][0].transcript;target.value+=(target.value?' ':'')+t};r.start()});$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญการเงิน การคลัง และการเบิกจ่ายขององค์กรปกครองส่วนท้องถิ่น\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- ปีงบประมาณ: ${val('year')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริง: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- จำนวนเงิน/วงเงิน: ${val('amount')||'[ยังไม่ได้ระบุ]'}\n- วัตถุประสงค์และความจำเป็น: ${val('purpose')||'[ยังไม่ได้ระบุ]'}\n- ระเบียบ/หนังสือสั่งการที่มี: ${val('rules')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- คำถามหรือจุดที่กังวล: ${val('question')||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- แยกข้อเท็จจริง ข้อมูลที่ขาด ฐานอำนาจ เงื่อนไข ขั้นตอน การวิเคราะห์ ความเสี่ยง และข้อเสนอแนะ\n- ห้ามสมมติเลขมาตรา เลขหนังสือ วันที่ วงเงิน หรือชื่อบุคคล\n- ตรวจสิทธิการเบิก เอกสารประกอบ ผู้มีอำนาจอนุมัติ วิธีงบประมาณ และ PDPA\n- ระบุ [ต้องตรวจสอบ/เพิ่มเติม] เมื่อข้อมูลไม่ครบ\n- ผู้ใช้ต้องตรวจทานกับระเบียบและหนังสือสั่งการฉบับล่าสุดก่อนใช้จริง`;$('output').textContent=text;$('output').style.display='block'};$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};$('clear').onclick=()=>location.reload();</script><script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/prompt-registry.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/core/context-integration.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
