<!doctype html>
<html lang="th" data-module-id="GP008">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3b75">
  <title>ผู้ช่วยสาธารณสุขและ รพ.สต. | GovPrompt Thailand</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 86px}h1{font-size:25px}.search,input,textarea,select{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:96px}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit;text-decoration:none;color:inherit;cursor:pointer}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}.field{position:relative}.field .mic{position:absolute;right:7px;bottom:7px;border:0;background:#edf2f7;border-radius:8px;padding:7px;cursor:pointer}.field input,.field textarea{padding-right:48px}label{display:block;font-weight:700;margin:9px 0 5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}.other-heading{grid-column:1/-1;margin-top:8px;padding-top:10px;border-top:1px solid #e0e7f0;font-weight:800;color:#0b3b75}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}.wrap{padding-bottom:30px}}
  </style>
  <link rel="stylesheet" href="assets/css/govprompt.css">
</head>
<body>
<header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header>
<main class="wrap">
  <h1>🩺 ผู้ช่วยสาธารณสุขและ รพ.สต.</h1>
  <input class="search" id="filter" placeholder="ค้นหา เช่น รพ.สต. PM2.5 โรคติดต่อ โครงการสุขภาพ ลูกน้ำ HI CI">
  <section class="list" id="tasks">
    <button class="task" data-task="วิเคราะห์งาน รพ.สต.">🏥 งาน รพ.สต.</button>
    <button class="task" data-task="เขียนโครงการส่งเสริมสุขภาพ">📊 โครงการสุขภาพ</button>
    <button class="task" data-task="วิเคราะห์โรคติดต่อและแผนควบคุมโรค">🦠 โรคติดต่อ</button>
    <button class="task" data-task="วิเคราะห์ปัญหา PM2.5 และผลกระทบสุขภาพ">🌫️ PM2.5</button>
    <button class="task" data-task="วางแผนอาหารปลอดภัยและสุขาภิบาล">🥗 อาหารปลอดภัย</button>
    <button class="task" data-task="วิเคราะห์งานอนามัยแม่และเด็ก">👶 แม่และเด็ก</button>
    <button class="task" data-task="วิเคราะห์งานผู้สูงอายุและผู้มีภาวะพึ่งพิง">👵 ผู้สูงอายุ/LTC</button>
    <button class="task" data-task="วางแผนส่งเสริมสุขภาพชุมชน">🏘️ สุขภาพชุมชน</button>
    <button class="task" data-task="วิเคราะห์การถ่ายโอนภารกิจสาธารณสุข">🔄 ถ่ายโอนภารกิจ</button>
    <button class="task" data-task="ตรวจโครงการและงบประมาณสาธารณสุข">💰 งบสุขภาพ</button>
    <button class="task" data-task="วิเคราะห์การใช้เงินบำรุง รพ.สต.">💵 เงินบำรุง รพ.สต.</button>
    <button class="task" data-task="ตรวจโครงการสาธารณสุขและเงินบำรุงครบวงจร">✅ โครงการ+เงินบำรุง</button>
    <button class="task" data-task="ร่างรายงานหรือหนังสือด้านสาธารณสุข">📄 รายงาน/หนังสือ</button>
    <button class="task" data-task="ตรวจ PDPA ข้อมูลสุขภาพ">🔒 PDPA สุขภาพ</button>
    <div id="publicHealthOtherToolsHeading" class="other-heading" role="heading" aria-level="2">อื่นๆ</div>
    <button id="healthWorkerToolkitTask" class="task health-worker-toolkit-task" type="button" data-task="เครื่องมือหมออนามัยและ รพ.สต." aria-controls="healthWorkerToolkitPanel">🩺 เครื่องมือหมออนามัย</button>
    <a id="mosquitoOnepageTask" class="task mosquito-static-entry" href="mosquito-onepage.html" data-task="วันเพจลูกน้ำยุงลาย HI CI" data-search="ลูกน้ำ ยุงลาย HI CI House Index Container Index" aria-controls="mosquitoOnepageTool">🦟 วันเพจลูกน้ำยุงลาย</a>
  </section>

  <section class="generator">
    <strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong>
    <div class="grid">
      <div class="field"><label>หน่วยงาน/รพ.สต.</label><input id="agency"><button class="mic" data-target="agency">🎤</button></div>
      <div class="field"><label>พื้นที่/กลุ่มเป้าหมาย</label><input id="area"><button class="mic" data-target="area">🎤</button></div>
      <div class="full field"><label>เรื่องหรือชื่อโครงการ</label><input id="subject"><button class="mic" data-target="subject">🎤</button></div>
      <div class="full field"><label>ข้อเท็จจริงและสถานการณ์</label><textarea id="facts"></textarea><button class="mic" data-target="facts">🎤</button></div>
      <div class="full field"><label>ปัญหาและความจำเป็น</label><textarea id="problem"></textarea><button class="mic" data-target="problem">🎤</button></div>
      <div class="full field"><label>เป้าหมาย/ตัวชี้วัด</label><textarea id="kpi"></textarea><button class="mic" data-target="kpi">🎤</button></div>
      <div class="full field"><label>กฎหมาย ระเบียบ หรือแนวทางที่มี</label><textarea id="law"></textarea><button class="mic" data-target="law">🎤</button></div>
      <div class="full field"><label>ผลลัพธ์ที่ต้องการ</label><textarea id="goal"></textarea><button class="mic" data-target="goal">🎤</button></div>
    </div>
    <div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div>
    <div class="output" id="output"></div>
    <div class="note">หลีกเลี่ยงชื่อผู้ป่วย เลขบัตรประชาชน ประวัติการรักษา และข้อมูลสุขภาพที่ระบุตัวบุคคลได้ เว้นแต่จำเป็นและได้รับอนุญาต</div>
  </section>
</main>

<script>
(() => {
  let task = '';
  const $ = id => document.getElementById(id);
  const val = id => ($(id)?.value || '').trim();
  const tasksEl = $('tasks');

  tasksEl.addEventListener('click', event => {
    const button = event.target.closest('.task');
    if (!button || button.classList.contains('health-worker-toolkit-task') || button.classList.contains('mosq-task') || button.classList.contains('mosquito-static-entry')) return;
    task = button.dataset.task || '';
    document.querySelectorAll('.task').forEach(item => item.classList.remove('active'));
    button.classList.add('active');
    $('selected').textContent = 'งานที่เลือก: ' + task;
  });

  $('filter').addEventListener('input', event => {
    const query = event.target.value.toLowerCase();
    document.querySelectorAll('#tasks .task').forEach(item => {
      const haystack = `${item.innerText} ${item.dataset.search || ''}`.toLowerCase();
      item.style.display = haystack.includes(query) ? 'block' : 'none';
    });
  });

  document.querySelectorAll('.mic').forEach(btn => btn.addEventListener('click', () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return alert('กรุณาเปิดด้วย Chrome หรือ Edge หรือใช้ไมค์บนคีย์บอร์ด');
    const r = new SR(); r.lang = 'th-TH'; btn.textContent = '🔴';
    r.onresult = e => { const el = $(btn.dataset.target), t = e.results[0][0].transcript; el.value += (el.value ? ' ' : '') + t; };
    r.onend = () => btn.textContent = '🎤';
    r.onerror = () => { btn.textContent = '🎤'; alert('ไม่สามารถใช้ไมโครโฟนได้ กรุณาตรวจสิทธิ์ไมโครโฟน'); };
    r.start();
  }));

  $('make').addEventListener('click', () => {
    if (!task) return alert('กรุณาเลือกงานก่อน');
    const text = `บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานสาธารณสุขท้องถิ่น รพ.สต. และการบริหารสาธารณสุข\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน/รพ.สต.: ${val('agency') || '[ยังไม่ได้ระบุ]'}\n- พื้นที่/กลุ่มเป้าหมาย: ${val('area') || '[ยังไม่ได้ระบุ]'}\n- เรื่องหรือชื่อโครงการ: ${val('subject') || '[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริงและสถานการณ์: ${val('facts') || '[ยังไม่ได้ระบุ]'}\n- ปัญหาและความจำเป็น: ${val('problem') || '[ยังไม่ได้ระบุ]'}\n- เป้าหมาย/ตัวชี้วัด: ${val('kpi') || '[ยังไม่ได้ระบุ]'}\n- กฎหมาย/ระเบียบ/แนวทางที่มี: ${val('law') || '[ไม่มี/ยังไม่ได้ระบุ]'}\n- ผลลัพธ์ที่ต้องการ: ${val('goal') || '[ยังไม่ได้ระบุ]'}${task.includes('เงินบำรุง') ? `\n\nข้อกำหนดเฉพาะเรื่องเงินบำรุง รพ.สต.\n- แยกตรวจแหล่งที่มาของเงิน แผนการใช้จ่ายเงินบำรุง ยอดเงินคงเหลือขั้นต่ำ และหลักฐานการอนุมัติ\n- ตรวจค่าใช้จ่ายรายรายการว่าอยู่ในประเภทที่เงินบำรุงจ่ายได้หรือไม่ พร้อมแยกฐานสิทธิออกจากอัตราและเงื่อนไขการเบิก\n- ตรวจอำนาจของคณะกรรมการ ผู้บริหารท้องถิ่น ผู้อำนวยการ รพ.สต. และคำสั่งมอบอำนาจที่ใช้บังคับจริง\n- แยกรายการที่ต้องดำเนินการจัดซื้อจัดจ้าง การก่อหนี้ผูกพัน การตรวจรับ และหลักฐานประกอบการจ่าย\n- หากเป็นโครงการ ให้ตรวจอำนาจหน้าที่ ความจำเป็น กลุ่มเป้าหมาย ตัวชี้วัด แผน งบประมาณ วิธีดำเนินงาน ผลสัมฤทธิ์ และความเสี่ยงตรวจสอบ\n- อ้างเฉพาะกฎหมาย ระเบียบ หรือแนวทางทางการที่ตรวจสอบต้นฉบับและสถานะปัจจุบันได้ ห้ามฟันธงจากข้อความค้นหาเพียงอย่างเดียว` : ''}\n\nPDPA CHECKPOINT\n- ตรวจและตัดข้อมูลสุขภาพหรือข้อมูลส่วนบุคคลที่ไม่จำเป็น\n- หากมีข้อมูลระบุตัวผู้ป่วย ให้ปกปิดหรือแทนด้วยข้อมูลทั่วไปก่อนวิเคราะห์\n\nข้อกำหนด\n- แยกข้อเท็จจริง ข้อมูลที่ขาด การวิเคราะห์ ความเสี่ยง และข้อเสนอแนะ\n- ห้ามสมมติชื่อบุคคล ตัวเลข สถิติ กฎหมาย หรือแนวทางวิชาการที่ผู้ใช้ไม่ได้ให้\n- ระบุสิ่งที่ต้องตรวจสอบเพิ่มเติมก่อนใช้จริง\n- ผลลัพธ์ไม่ใช้แทนการวินิจฉัยหรือคำสั่งของวิชาชีพ`;
    $('output').textContent = text;
    $('output').style.display = 'block';
  });

  $('copy').addEventListener('click', async () => {
    if (!$('output').textContent) return alert('กรุณาสร้าง Prompt ก่อน');
    await navigator.clipboard.writeText($('output').textContent);
    alert('คัดลอกแล้ว');
  });
  $('clear').addEventListener('click', () => location.reload());
})();
</script>

<script id="mosquitoOnepageFeatureScript" src="assets/js/features/mosquito-survey-onepage-v1.js?v=1.0.1"></script>
<script id="publicHealthWorkerToolkitScript" src="assets/js/features/public-health-worker-toolkit-v1.js?v=1.0.2"></script>
<script id="mosquitoPublicHealthPlacementScript" src="assets/js/features/mosquito-public-health-placement-v1.js?v=1.0.2"></script>
<script src="assets/js/core/shared-context.js"></script>
<script src="assets/js/core/prompt-registry.js"></script>
<script src="assets/js/core/transaction-router.js"></script>
<script src="assets/js/core/context-integration.js"></script>
<script src="assets/js/core/document-loader.js"></script>
<script src="assets/js/core/citation-engine.js"></script>
<script src="assets/js/core/knowledge-index.js"></script>
<script src="assets/js/core/semantic-search.js"></script>
<script src="assets/js/core/knowledge-engine.js"></script>
<script src="assets/js/govprompt.js"></script>
<script src="assets/js/prompt-engine.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/mic.js"></script>
</body>
</html>
