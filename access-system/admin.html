<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082b55">
<title>GovPrompt Code Generator</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:#f5f8fc;color:#172033;margin:0}.wrap{max-width:920px;margin:48px auto;padding:0 18px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:20px;padding:28px;box-shadow:0 12px 32px rgba(8,43,85,.08)}input,button{font:inherit;padding:13px 15px;border-radius:10px}input{width:100%;border:1px solid #dfe7f1}button{border:0;background:#0e5aa7;color:#fff;font-weight:850;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.muted{color:#667085}.code{font-size:24px;font-weight:900;letter-spacing:.05em;background:#f7f9fc;border:1px dashed #98a2b3;padding:18px;border-radius:12px;margin:18px 0;word-break:break-all}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:14px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}.danger{background:#b42318}.secondary{background:#475467}.success{background:#067647}@media(max-width:700px){.toolbar{grid-template-columns:1fr}table{display:block;overflow:auto}}
</style>
</head>
<body><div class="wrap">
<div id="loginBox" class="card"><h1>ระบบออกรหัสสมาชิก</h1><p class="muted">สำหรับผู้ดูแล GovPrompt Thailand</p><input id="pw" type="password" placeholder="รหัสผ่านผู้ดูแล"><div class="row"><button id="unlock">เข้าสู่ระบบ</button></div><p id="err" style="color:#b42318"></p></div>
<div id="panel" class="card hidden"><h1>ออกรหัสให้ลูกค้า</h1><p class="muted">ใส่ชื่อลูกค้า แล้วกดออกรหัสถัดไป</p><label>ชื่อลูกค้า / LINE / Facebook</label><input id="name" placeholder="เช่น นายสมชาย ใจดี"><div class="row"><button id="issue">ออกรหัสถัดไป</button><button id="export" class="secondary">ส่งออก CSV</button><button id="lock" class="secondary">ออกจากระบบ</button></div><div id="out" class="hidden"><div class="code" id="newCode"></div><div class="row"><button id="copy">คัดลอกรหัส</button><button id="copyMsg" class="success">คัดลอกข้อความส่งลูกค้า</button></div><p id="copyStatus" class="muted"></p></div><div class="toolbar"><input id="search" placeholder="ค้นหาชื่อลูกค้าหรือรหัส"><button id="clearAll" class="danger">ล้างข้อมูลทั้งหมด</button></div><table><thead><tr><th>#</th><th>ลูกค้า</th><th>รหัส</th><th>วันที่</th><th></th></tr></thead><tbody id="log"></tbody></table></div>
</div>
<script src="admin-client.js"></script></body></html>
