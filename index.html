<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12372a">
  <meta name="description" content="GovPrompt Thailand — Government AI Copilot สำหรับงานราชการไทย">
  <title>GovPrompt Thailand — Government AI Copilot</title>
  <link rel="stylesheet" href="assets/css/govprompt.css?v=2.3.3">
  <link rel="stylesheet" href="assets/css/home-v3.css?v=2.3.3">
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="app-brand" href="index.html" aria-label="GovPrompt Thailand หน้าหลัก">
      <span class="brand-emblem" aria-hidden="true">กพ</span>
      <span><strong>GovPrompt Thailand</strong><small>Government AI Copilot</small></span>
    </a>
    <div class="header-actions">
      <span class="secure-state"><span aria-hidden="true">●</span> ระบบพร้อมใช้งาน</span>
      <button class="icon-button" id="newChat" type="button" aria-label="เริ่มบทสนทนาใหม่" title="เริ่มบทสนทนาใหม่">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main class="chat-main" id="main-content">
    <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
      <span class="welcome-mark" aria-hidden="true">กพ</span>
      <p class="eyebrow">GOVERNMENT AI COPILOT</p>
      <h1 id="welcomeTitle">วันนี้ให้ช่วยเรื่องอะไรดี</h1>
      <p>ค้นข้อมูลราชการล่าสุด · วิเคราะห์ · อ้างอิง · สร้างงานพร้อมใช้</p>
      <div class="quick-actions" aria-label="คำถามแนะนำ">
        <button type="button" data-prompt="รถเสียระหว่างไปราชการ ต้องดำเนินการอย่างไร">รถเสียระหว่างไปราชการ</button>
        <button type="button" data-prompt="ช่วยร่างหนังสือราชการ">ร่างหนังสือราชการ</button>
        <button type="button" data-prompt="ช่วยตรวจ TOR และระบุความเสี่ยง">ตรวจ TOR</button>
        <button type="button" data-prompt="ช่วยวิเคราะห์ข้อกฎหมายที่เกี่ยวข้อง">วิเคราะห์ข้อกฎหมาย</button>
        <button type="button" data-prompt="แนวทางการใช้และเบิกจ่ายเงินบำรุง">เงินบำรุง</button>
        <button type="button" data-prompt="ช่วยวิเคราะห์และร่างข้อบัญญัติ">ข้อบัญญัติ</button>
      </div>
    </section>

    <section class="conversation" id="conversation" aria-live="polite" aria-label="บทสนทนา"></section>

    <div class="composer-region">
      <form class="composer" id="chatForm">
        <label class="sr-only" for="promptInput">ข้อความถึง GovPrompt</label>
        <textarea id="promptInput" rows="1" maxlength="6000" placeholder="ถามเกี่ยวกับงานราชการ..." required></textarea>
        <div class="composer-tools">
          <div class="input-actions">
            <button class="tool-button" type="button" data-file-picker="attachmentInput" aria-label="แนบไฟล์" title="แนบไฟล์">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 1 1-2.8-2.8l8.9-8.9"/></svg>
            </button>
            <input id="attachmentInput" type="file" multiple hidden>
            <button class="tool-button" type="button" data-file-picker="cameraInput" aria-label="ถ่ายภาพหรือเลือกภาพ" title="ถ่ายภาพหรือเลือกภาพ">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
            <button class="tool-button" id="micButton" type="button" aria-label="พิมพ์ด้วยเสียง" title="พิมพ์ด้วยเสียง">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
            </button>
          </div>
          <div class="attachment-status" id="attachmentStatus" aria-live="polite"></div>
          <button class="send-button" type="submit" aria-label="ส่งข้อความ">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </form>
      <p class="privacy-note">AI ช่วยค้น วิเคราะห์ และร่างงาน — ผู้ใช้ตรวจสอบและตัดสินใจก่อนนำไปใช้</p>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <a class="active" href="index.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3z"/></svg><span>หน้าหลัก</span></a>
    <button type="button" data-panel="history"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>ประวัติ</span></button>
    <button type="button" data-panel="knowledge"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5a3 3 0 0 1 3-3h5v18H7a3 3 0 0 0-3 2zM20 5a3 3 0 0 0-3-3h-5v18h5a3 3 0 0 1 3 2z"/></svg><span>คลังความรู้</span></button>
    <button type="button" data-panel="profile"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>โปรไฟล์</span></button>
    <button type="button" data-panel="tools"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M9 10v9"/></svg><span>เครื่องมือ</span></button>
  </nav>

  <dialog class="app-dialog" id="appDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow"></p><h2 id="dialogTitle"></h2></div><button class="icon-button" id="closeDialog" type="button" aria-label="ปิด" data-dialog-close>×</button></div>
    <div id="dialogContent"></div>
  </dialog>

  <noscript>
    <section class="no-script-tools" aria-label="เครื่องมือสำหรับผู้ใช้ขั้นสูง">
      <h1>เครื่องมือสำหรับผู้ใช้ขั้นสูง</h1>
      <p>กรุณาเปิด JavaScript เพื่อใช้ Government AI Copilot หรือเลือกเครื่องมือเฉพาะด้าน</p>

      <a href="gp013.html">GP013</a>
    </section>
  </noscript>

  <script src="assets/js/core/freshness-engine.js?v=2.3.3" defer></script>

</body>
