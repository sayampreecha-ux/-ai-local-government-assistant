<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3b75">
<title>ผู้ช่วยการศึกษา | GovPrompt Thailand</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f7f9fc;color:#10233f}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4eaf2}.bar{max-width:980px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between}.bar a{text-decoration:none;color:#0b3b75}.wrap{max-width:980px;margin:auto;padding:16px 14px 80px}h1{font-size:25px;margin:4px 0 14px}.search,input,textarea{width:100%;border:1px solid #d8e1ec;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:96px}.list,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.task{border:1px solid #e0e7f0;background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit}.task.active{border-color:#0b3b75;box-shadow:0 0 0 2px #dbe8f7}.generator{margin-top:16px;background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:15px}.full{grid-column:1/-1}.field{position:relative}.field label{display:block;font-weight:700;margin:9px 0 5px}.mic{position:absolute;right:7px;top:36px;border:0;background:#edf2f7;border-radius:8px;padding:7px;cursor:pointer}.field textarea+.mic{top:36px}.mic.live{background:#fee2e2;color:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#0b3b75;color:#fff}.secondary{background:#edf2f7}.output{display:none;white-space:pre-wrap;background:#f3f7fb;border-radius:10px;padding:12px;margin-top:12px}.note{font-size:12px;color:#65758b;margin-top:10px}@media(max-width:650px){.list,.grid{grid-template-columns:1fr}.wrap{padding-bottom:30px}}
</style>
<link rel="stylesheet" href="assets/css/govprompt.css"></head>
<body>
<header class="top"><div class="bar"><a href="index.html"><b>GovPrompt Thailand</b></a><a href="index.html">← ผู้ช่วยทั้งหมด</a></div></header>
<main class="wrap">
<h1>🎓 ผู้ช่วยการศึกษา</h1>
<input class="search" id="filter" placeholder="ค้นหา เช่น แผนการศึกษา อาหารกลางวัน ศพด.">
<section class="list" id="tasks">
<button class="task" data-task="จัดทำแผนพัฒนาการศึกษา">📚 แผนพัฒนาการศึกษา</button>
<button class="task" data-task="จัดทำแผนปฏิบัติการประจำปีด้านการศึกษา">📅 แผนปฏิบัติการประจำปี</button>
<button class="task" data-task="เขียนและตรวจโครงการด้านการศึกษา">📝 โครงการการศึกษา</button>
<button class="task" data-task="วิเคราะห์งบประมาณด้านการศึกษา">💰 งบประมาณการศึกษา</button>
<button class="task" data-task="วิเคราะห์โครงการอาหารกลางวัน">🍱 อาหารกลางวัน</button>
<button class="task" data-task="วิเคราะห์โครงการอาหารเสริม (นม)">🥛 อาหารเสริม (นม)</button>
<button class="task" data-task="วิเคราะห์การบริหารรถรับส่งนักเรียน">🚌 รถรับส่งนักเรียน</button>
<button class="task" data-task="วิเคราะห์งานศูนย์พัฒนาเด็กเล็ก">👶 ศูนย์พัฒนาเด็กเล็ก</button>
<button class="task" data-task="วิเคราะห์งานโรงเรียนในสังกัด อปท.">🏫 โรงเรียนในสังกัด</button>
<button class="task" data-task="พัฒนาหลักสูตรท้องถิ่น">📖 หลักสูตรท้องถิ่น</button>
<button class="task" data-task="พัฒนาครูและบุคลากรทางการศึกษา">👩‍🏫 พัฒนาครูและบุคลากร</button>
<button class="task" data-task="ประกันคุณภาพการศึกษา">✅ ประกันคุณภาพ</button>
<button class="task" data-task="จัดซื้อสื่อและครุภัณฑ์การศึกษา">🖥️ สื่อและครุภัณฑ์</button>
<button class="task" data-task="ร่างหนังสือราชการด้านการศึกษา">📄 หนังสือราชการ</button>
<button class="task" data-task="วิเคราะห์ระเบียบและหนังสือสั่งการด้านการศึกษา">⚖️ วิเคราะห์ระเบียบ</button>
<button class="task" data-task="ตรวจโครงการด้านการศึกษาก่อนเสนออนุมัติ">🔍 ตรวจโครงการก่อนอนุมัติ</button>
</section>
<section class="generator">
<strong id="selected">เลือกงานด้านบนเพื่อเริ่ม</strong>
<div class="grid">
<div class="field"><label>หน่วยงาน</label><input id="agency"><button class="mic" data-target="agency">🎤</button></div>
<div class="field"><label>สถานศึกษา/ศูนย์พัฒนาเด็กเล็ก</label><input id="school"><button class="mic" data-target="school">🎤</button></div>
<div class="full field"><label>ชื่อเรื่องหรือชื่อโครงการ</label><input id="subject"><button class="mic" data-target="subject">🎤</button></div>
<div class="full field"><label>ข้อเท็จจริงและสภาพปัญหา</label><textarea id="facts"></textarea><button class="mic" data-target="facts">🎤</button></div>
<div class="full field"><label>วัตถุประสงค์</label><textarea id="objective"></textarea><button class="mic" data-target="objective">🎤</button></div>
<div class="field"><label>กลุ่มเป้าหมาย</label><input id="target"><button class="mic" data-target="target">🎤</button></div>
<div class="field"><label>งบประมาณ</label><input id="budget"><button class="mic" data-target="budget">🎤</button></div>
<div class="full field"><label>ระเบียบ/หนังสือสั่งการ/เอกสารอ้างอิง</label><textarea id="law"></textarea><button class="mic" data-target="law">🎤</button></div>
<div class="full field"><label>ประเด็นที่ต้องการให้ AI ช่วย</label><textarea id="question"></textarea><button class="mic" data-target="question">🎤</button></div>
<div class="full field"><label>ผลลัพธ์ที่ต้องการ</label><textarea id="result"></textarea><button class="mic" data-target="result">🎤</button></div>
</div>
<div class="actions"><button class="btn primary" id="make">สร้าง Prompt</button><button class="btn secondary" id="copy">คัดลอก</button><button class="btn secondary" id="clear">ล้าง</button></div>
<div class="output" id="output"></div>
<div class="note">หลีกเลี่ยงข้อมูลส่วนบุคคลของเด็ก นักเรียน ครู หรือผู้ปกครองที่ไม่จำเป็น และตรวจทานผลลัพธ์ก่อนใช้จริง</div>
</section>
</main>
<script>
let task='';const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),tasks=[...document.querySelectorAll('.task')];
tasks.forEach(b=>b.onclick=()=>{task=b.dataset.task;tasks.forEach(x=>x.classList.remove('active'));b.classList.add('active');$('selected').textContent='งานที่เลือก: '+task});
$('filter').oninput=e=>tasks.forEach(x=>x.style.display=x.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');
function speak(target,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('เบราว์เซอร์นี้ยังไม่รองรับไมโครโฟน กรุณาใช้ Chrome/Edge หรือไมค์บนคีย์บอร์ด');return}const r=new SR();r.lang='th-TH';r.interimResults=false;btn.classList.add('live');r.onresult=e=>{const el=$(target),t=e.results[0][0].transcript;el.value+=(el.value?' ':'')+t};r.onerror=()=>alert('ไม่สามารถรับเสียงได้ กรุณาตรวจสิทธิ์ไมโครโฟน');r.onend=()=>btn.classList.remove('live');r.start()}
document.querySelectorAll('.mic').forEach(b=>b.onclick=()=>speak(b.dataset.target,b));
$('make').onclick=()=>{if(!task)return alert('กรุณาเลือกงานก่อน');const text=`บทบาท\nคุณเป็น Government AI Copilot ผู้เชี่ยวชาญงานการศึกษาขององค์กรปกครองส่วนท้องถิ่น\n\nภารกิจ\n${task}\n\nข้อมูลจากผู้ใช้\n- หน่วยงาน: ${val('agency')||'[ยังไม่ได้ระบุ]'}\n- สถานศึกษา/ศูนย์พัฒนาเด็กเล็ก: ${val('school')||'[ยังไม่ได้ระบุ]'}\n- เรื่อง/โครงการ: ${val('subject')||'[ยังไม่ได้ระบุ]'}\n- ข้อเท็จจริงและสภาพปัญหา: ${val('facts')||'[ยังไม่ได้ระบุ]'}\n- วัตถุประสงค์: ${val('objective')||'[ยังไม่ได้ระบุ]'}\n- กลุ่มเป้าหมาย: ${val('target')||'[ยังไม่ได้ระบุ]'}\n- งบประมาณ: ${val('budget')||'[ยังไม่ได้ระบุ]'}\n- ระเบียบ/เอกสารอ้างอิง: ${val('law')||'[ไม่มี/ยังไม่ได้ระบุ]'}\n- ประเด็นที่ต้องการให้ช่วย: ${val('question')||'[ยังไม่ได้ระบุ]'}\n- ผลลัพธ์ที่ต้องการ: ${val('result')||'[ยังไม่ได้ระบุ]'}\n\nข้อกำหนด\n- ใช้ข้อเท็จจริงและเอกสารที่ผู้ใช้ให้เป็นหลัก ห้ามสมมติชื่อบุคคล วันที่ เลขหนังสือ วงเงิน หรือข้อกฎหมาย\n- แยกข้อเท็จจริง การวิเคราะห์ ความเสี่ยง และข้อเสนอแนะ\n- ตรวจอำนาจหน้าที่ ความจำเป็น งบประมาณ ความคุ้มค่า KPI และความสอดคล้องกับแผนเมื่อเกี่ยวข้อง\n- ตรวจ PDPA โดยเฉพาะข้อมูลเด็ก นักเรียน ครู และผู้ปกครอง\n- ระบุข้อมูลที่ต้องตรวจสอบเพิ่มเติมก่อนนำไปใช้จริง`;$('output').textContent=text;$('output').style.display='block'};
$('copy').onclick=async()=>{if(!$('output').textContent)return alert('กรุณาสร้าง Prompt ก่อน');await navigator.clipboard.writeText($('output').textContent);alert('คัดลอกแล้ว')};
$('clear').onclick=()=>location.reload();
</script>
<script src="assets/js/core/shared-context.js"></script><script src="assets/js/core/prompt-registry.js"></script><script src="assets/js/core/transaction-router.js"></script><script src="assets/js/core/context-integration.js"></script><script src="assets/js/core/knowledge-engine.js"></script><script src="assets/js/govprompt.js"></script><script src="assets/js/prompt-engine.js"></script><script src="assets/js/search.js"></script><script src="assets/js/mic.js"></script></body></html>
